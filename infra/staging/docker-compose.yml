name: magicmusiccrm-v3

services:
  caddy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../../downloads:/srv/downloads:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - public

  # Fix the storage mount's ownership before the API boots. The API runs as
  # uid 10001 (Dockerfile `USER magiccrm`) with `cap_drop: ALL`, so it cannot
  # chown its own mount. The bind-mounted host directory comes up owned by root,
  # which made every POST /files (chat photo, file, voice message) fail with
  # EACCES → 500. This one-shot root container hands the tree to 10001 first.
  storage-init:
    image: alpine:3.20
    command: sh -c "mkdir -p /storage/private && chown -R 10001:10001 /storage"
    user: "0:0"
    volumes:
      - ../../storage:/storage
    restart: "no"
    networks:
      - private

  api:
    build:
      context: ../../server
      dockerfile: Dockerfile
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    env_file:
      - path: ./.env
        required: false
    environment:
      NODE_ENV: staging
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_APP_USER}:${POSTGRES_APP_PASSWORD}@postgres:5432/${POSTGRES_DB}
      MIGRATION_DATABASE_URL: postgresql://${POSTGRES_OWNER_USER}:${POSTGRES_OWNER_PASSWORD}@postgres:5432/${POSTGRES_DB}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS}
      FILE_STORAGE_ROOT: /opt/magicmusiccrm/storage
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
      SMTP_FALLBACK_HOST: ${SMTP_FALLBACK_HOST:-}
      SMTP_FALLBACK_PORT: ${SMTP_FALLBACK_PORT:-465}
      SMTP_FALLBACK_SECURE: ${SMTP_FALLBACK_SECURE:-true}
      SMTP_FALLBACK_USER: ${SMTP_FALLBACK_USER:-}
      SMTP_FALLBACK_PASSWORD: ${SMTP_FALLBACK_PASSWORD:-}
      SMTP_FALLBACK_FROM_EMAIL: ${SMTP_FALLBACK_FROM_EMAIL:-}
      FIREBASE_SERVER_KEY: ${FIREBASE_SERVER_KEY:-}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL:-}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY:-}
      FIREBASE_TIMEOUT_MS: ${FIREBASE_TIMEOUT_MS:-5000}
      NOTIFICATION_TOKEN_ENCRYPTION_KEY: ${NOTIFICATION_TOKEN_ENCRYPTION_KEY:-}
      HOLLIHOP_BASE_URL: ${HOLLIHOP_BASE_URL:-https://sokol.t8s.ru/Api/V2/}
      HOLLIHOP_AUTH_KEY: ${HOLLIHOP_AUTH_KEY:-}
      HOLLIHOP_TIMEOUT_MS: ${HOLLIHOP_TIMEOUT_MS:-5000}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
    volumes:
      - ../../storage:/opt/magicmusiccrm/storage
    command: sh -c "node dist/db/migrate.js up && node dist/main.js"
    depends_on:
      storage-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - public
      - private

  postgres:
    image: postgres:16.4-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_OWNER_USER}
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_OWNER_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - private

  redis:
    image: redis:7.4.1-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - private

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:

networks:
  public:
  private:
    internal: true
