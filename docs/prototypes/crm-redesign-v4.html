<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MagicMusicCRM — Redesign v4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#C5A059; --gold-2:#BFA37E; --gold-dim:rgba(197,160,89,.16);
  --bg:#101012; --surface:#1A1A1D; --surface-2:#202024; --sidebar:#151518;
  --input:#242427; --divider:#2A2A2D; --text:#FFFFFF; --text-2:#A1A1AA; --text-3:#6E6E76;
  --online:#10B981; --danger:#EF4444; --warn:#F5A623;
  --radius:14px; --radius-sm:10px;
  --z-base:1; --z-sticky:20; --z-sheet:60; --z-overlay:55; --z-menu:80; --z-toast:90; --z-frame:5;
  --ease:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:#070708;color:var(--text);
  -webkit-font-smoothing:antialiased;overflow:hidden}
*{scrollbar-width:none;-ms-overflow-style:none}
*::-webkit-scrollbar{width:0;height:0;display:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}

/* ===== top control bar ===== */
.topbar{position:fixed;top:0;left:0;right:0;height:54px;background:#0b0b0d;border-bottom:1px solid var(--divider);
  display:flex;align-items:center;gap:14px;padding:0 18px;z-index:var(--z-toast)}
.topbar .brand{font-weight:800;font-size:15px;letter-spacing:.2px;display:flex;align-items:center;gap:9px}
.topbar .brand .dot{width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,var(--gold),#8a6d34);
  display:grid;place-items:center;color:#1a1407;font-weight:800;font-size:13px}
.seg{display:flex;background:var(--surface);border:1px solid var(--divider);border-radius:10px;padding:3px;gap:2px}
.seg button{padding:6px 12px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--text-2);white-space:nowrap;min-height:34px}
.seg button.on{background:var(--gold);color:#1a1407}
.topbar .spacer{flex:1}
.frameseg button{padding:6px 10px;font-size:15px}
.topbar .label{font-size:11px;color:var(--text-3);font-weight:600;text-transform:uppercase;letter-spacing:.6px}

/* ===== stage ===== */
.stage{position:fixed;top:54px;left:0;right:0;bottom:0;display:grid;place-items:center;
  background:radial-gradient(1200px 600px at 50% -10%,#15151a,#070708)}

/* ===== frames ===== */
.frame{position:relative;background:var(--bg);overflow:hidden;box-shadow:0 30px 90px rgba(0,0,0,.6);z-index:var(--z-frame)}
.frame.phone{width:390px;height:780px;border-radius:38px;border:10px solid #000;}
.frame.phone .notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:150px;height:26px;
  background:#000;border-radius:0 0 16px 16px;z-index:50}
.frame.desktop{width:1180px;height:720px;border-radius:14px;border:1px solid #2a2a30}
@media (max-width:1240px){.frame.desktop{width:96vw}}
.viewport{position:absolute;inset:0;overflow:hidden}

/* ===== generic ===== */
.ellipsis{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.scroll{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.badge{font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--gold-dim);color:var(--gold);white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:6px 11px;border-radius:999px;
  background:var(--input);color:var(--text-2);border:1px solid transparent;white-space:nowrap;min-height:34px}
.chip.on{background:var(--gold-dim);color:var(--gold);border-color:rgba(197,160,89,.4)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font-weight:600;font-size:13px;
  padding:0 14px;height:40px;border-radius:10px;background:var(--input);color:var(--text);white-space:nowrap}
.btn.gold{background:var(--gold);color:#1a1407}
.btn.ghost{background:transparent;border:1px solid var(--divider)}
.icobtn{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--text-2);flex:none}
.icobtn:hover{background:var(--surface-2);color:var(--text)}
svg{display:block;flex:none}
.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:15px;
  color:#1a1407;flex:none;background:var(--gold)}
.av-b{background:#7C6FD1}.av-c{background:#4FAE8B}.av-d{background:#D17C7C}.av-e{background:#5B9BD5}.av-f{background:#C9A227}

/* ===== app shell (mobile) ===== */
.app{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.topnav{height:54px;flex:none;display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--sidebar);
  border-bottom:1px solid var(--divider);padding-top:8px}
.phone .topnav{padding-top:22px;height:68px}
.topnav .ttl{font-weight:700;font-size:17px}
.topnav .sub{font-size:11.5px;color:var(--text-2)}
.content{flex:1;position:relative;overflow:hidden}
.bottomnav{height:60px;flex:none;display:flex;background:var(--sidebar);border-top:1px solid var(--divider)}
.phone .bottomnav{height:74px;padding-bottom:12px}
.bottomnav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--text-3);font-size:10.5px;font-weight:600;min-height:44px;position:relative;padding:0 2px}
.bottomnav button .lbl{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bottomnav button.on{color:var(--gold)}
.bottomnav button.on svg{color:var(--gold)}

/* ===== desktop shell ===== */
.dshell{position:absolute;inset:0;display:flex}
.rail{width:78px;flex:none;background:var(--sidebar);border-right:1px solid var(--divider);
  display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:6px}
.rail .logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--gold),#8a6d34);
  display:grid;place-items:center;color:#1a1407;font-weight:800;margin-bottom:8px}
.rail button{width:58px;padding:8px 2px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:4px;
  color:var(--text-3);font-size:9.5px;font-weight:600;min-height:54px}
.rail button .lbl{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rail button.on{background:var(--gold-dim);color:var(--gold)}
.rail .rspacer{flex:1}
.dmain{flex:1;display:flex;min-width:0}
.dhead{height:60px;flex:none;display:flex;align-items:center;gap:12px;padding:0 20px;border-bottom:1px solid var(--divider);
  background:var(--sidebar)}
.dhead .ttl{font-weight:700;font-size:18px}
.dcol{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg)}

/* ===== chat ===== */
.chatwrap{display:flex;height:100%;min-width:0}
.chatlist{width:100%;display:flex;flex-direction:column;min-width:0}
.desktop .chatlist{width:330px;flex:none;border-right:1px solid var(--divider)}
.search{margin:10px 12px;display:flex;align-items:center;gap:8px;background:var(--input);border-radius:10px;padding:0 12px;height:40px;flex:none}
.search input{flex:1;background:none;border:none;color:var(--text);font-size:13.5px;outline:none;min-width:0}
.search input::placeholder{color:var(--text-3)}
.convlist{flex:1;overflow-y:auto}
.conv{display:flex;align-items:center;gap:12px;padding:10px 14px;cursor:pointer;border-bottom:1px solid rgba(42,42,45,.5)}
.conv:hover{background:var(--surface)}
.conv.on{background:var(--surface-2)}
.conv .cmid{flex:1;min-width:0}
.conv .cname{font-weight:600;font-size:14.5px;display:flex;justify-content:space-between;gap:8px}
.conv .cname .t{font-size:11px;color:var(--text-3);font-weight:500;flex:none}
.conv .cmsg{font-size:12.5px;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.conv .unread{min-width:20px;height:20px;border-radius:999px;background:var(--gold);color:#1a1407;font-size:11px;font-weight:700;
  display:grid;place-items:center;padding:0 6px;flex:none}
.dot-on{width:11px;height:11px;border-radius:50%;background:var(--online);border:2px solid var(--sidebar);
  position:absolute;right:0;bottom:0}
.avwrap{position:relative;flex:none}

.thread{flex:1;display:flex;flex-direction:column;min-width:0;background:
  linear-gradient(rgba(7,7,9,.92),rgba(7,7,9,.92)),
  repeating-linear-gradient(45deg,#0d0d10 0 12px,#0b0b0e 12px 24px)}
.thread.hidden{display:none}
.chathead{height:60px;flex:none;display:flex;align-items:center;gap:12px;padding:0 12px;background:var(--sidebar);
  border-bottom:1px solid var(--divider)}
.chathead .back{display:none}
.phone .chathead .back{display:grid}
.chathead .cmid{flex:1;min-width:0}
.chathead .cname{font-weight:700;font-size:15px}
.chathead .cstat{font-size:11.5px;color:var(--online)}
.msgs{flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:74%;padding:8px 12px;border-radius:14px;font-size:14px;line-height:1.35;position:relative;word-break:break-word}
.msg.in{background:var(--surface-2);align-self:flex-start;border-bottom-left-radius:5px}
.msg.out{background:var(--gold);color:#1a1407;align-self:flex-end;border-bottom-right-radius:5px}
.msg .mt{font-size:10px;opacity:.6;margin-top:3px;text-align:right}
.daysep{align-self:center;font-size:11px;color:var(--text-3);background:rgba(0,0,0,.4);padding:3px 12px;border-radius:999px;margin:6px 0}
.voice{display:flex;align-items:center;gap:10px;min-width:190px}
.voice .play{width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.18);display:grid;place-items:center;flex:none;color:#1a1407}
.msg.in .voice .play{background:var(--gold);color:#1a1407}
.wave{flex:1;height:24px;display:flex;align-items:center;gap:2px}
.wave i{flex:1;background:currentColor;border-radius:2px;opacity:.55}
.voice .vt{font-size:11px;opacity:.7}
.composer{flex:none;display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--sidebar);border-top:1px solid var(--divider)}
.composer .field{flex:1;display:flex;align-items:center;gap:8px;background:var(--input);border-radius:22px;padding:0 14px;height:44px;min-width:0}
.composer .field input{flex:1;background:none;border:none;color:var(--text);font-size:14px;outline:none;min-width:0}
.composer .send{width:44px;height:44px;border-radius:50%;background:var(--gold);color:#1a1407;display:grid;place-items:center;flex:none}
.emojibar{position:absolute;bottom:64px;left:12px;right:12px;background:var(--surface-2);border:1px solid var(--divider);
  border-radius:14px;padding:10px;display:none;flex-wrap:wrap;gap:6px;z-index:var(--z-menu)}
.emojibar.open{display:flex}
.emojibar button{font-size:22px;padding:4px;border-radius:8px}
.emojibar button:hover{background:var(--surface)}
.attachsheet{position:absolute;bottom:64px;left:12px;width:230px;background:var(--surface-2);border:1px solid var(--divider);
  border-radius:14px;padding:6px;display:none;z-index:var(--z-menu)}
.attachsheet.open{display:block}
.attachsheet button{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border-radius:10px;font-size:14px;font-weight:500;color:var(--text)}
.attachsheet button:hover{background:var(--surface)}

/* ===== schedule ===== */
.schtoolbar{flex:none;display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--divider);background:var(--sidebar)}
.schtoolbar .mh{font-weight:700;font-size:16px}
.viewseg{margin-left:auto}
.calwrap{flex:1;overflow:auto;position:relative}
.grid{display:grid;position:relative;min-width:max-content}
.timecol-h{position:sticky;left:0;top:0;z-index:31;background:var(--sidebar)}
.colhead{position:sticky;top:0;z-index:30;background:var(--sidebar);border-bottom:1px solid var(--divider);
  border-right:1px solid var(--divider);padding:8px 6px;text-align:center;font-size:12px;font-weight:600}
.colhead .sub{font-size:10px;color:var(--text-2);font-weight:500}
.timecell{position:sticky;left:0;z-index:20;background:var(--sidebar);border-right:1px solid var(--divider);
  border-bottom:1px solid var(--divider);font-size:11px;color:var(--text-2);padding:4px 8px;text-align:right;min-width:58px;display:flex;align-items:flex-start;justify-content:flex-end}
.slot{border-right:1px solid var(--divider);border-bottom:1px solid var(--divider);height:52px;position:relative;cursor:pointer;background:var(--bg)}
.slot:hover{background:var(--surface)}
.slot.sel{background:var(--gold-dim)}
.lesson{position:absolute;left:3px;right:3px;border-radius:8px;padding:5px 7px;overflow:hidden;
  background:linear-gradient(180deg,rgba(197,160,89,.92),rgba(160,128,64,.92));color:#1a1407;font-size:11px;font-weight:600;
  z-index:10;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.lesson .ls{font-size:10px;font-weight:500;opacity:.85;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lesson.partial{box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}

/* ===== kanban / clients ===== */
.clienttop{flex:none;padding:10px 14px;border-bottom:1px solid var(--divider);background:var(--sidebar);display:flex;flex-direction:column;gap:10px}
.segctl{display:flex;background:var(--input);border-radius:11px;padding:3px;gap:3px;position:relative}
.segctl button{flex:1;padding:9px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--text-2);min-height:44px;transition:all .18s var(--ease)}
.segctl button.on{background:var(--gold);color:#1a1407}
.segctl button.dropzone{outline:2px dashed var(--gold);outline-offset:-3px;background:var(--gold-dim);color:var(--gold);transform:scale(1.04)}
.clientbar{display:flex;align-items:center;gap:8px}
.board{flex:1;overflow:auto;display:flex;gap:12px;padding:14px;align-items:flex-start}
.kcol{width:268px;flex:none;background:var(--surface);border-radius:14px;display:flex;flex-direction:column;max-height:100%}
.kcol.drop{outline:2px dashed var(--gold);outline-offset:-2px;background:var(--gold-dim)}
.kcolhead{display:flex;align-items:center;gap:8px;padding:11px 12px;border-bottom:1px solid var(--divider);position:sticky;top:0;background:var(--surface);border-radius:14px 14px 0 0;z-index:2}
.kcolhead .kt{font-weight:700;font-size:13.5px;flex:1;min-width:0}
.kcolhead .kn{font-size:11px;color:var(--text-3);font-weight:700}
.kcards{padding:10px;display:flex;flex-direction:column;gap:9px;overflow-y:auto;flex:1}
.card{background:var(--surface-2);border:1px solid var(--divider);border-radius:12px;padding:11px;cursor:grab;
  transition:transform .12s var(--ease),box-shadow .12s var(--ease)}
.card:active{cursor:grabbing}
.card.lift{transform:scale(1.03) rotate(-1deg);box-shadow:0 12px 30px rgba(0,0,0,.5);border-color:var(--gold);z-index:50}
.card .cn{font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card .cmeta{font-size:11.5px;color:var(--text-2);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap}
.card .ctags{margin-top:7px;display:flex;gap:5px;flex-wrap:wrap}
.card .ctag{font-size:10px;font-weight:600;padding:2px 7px;border-radius:999px;background:var(--input);color:var(--text-2)}
.insert-ind{height:3px;background:var(--gold);border-radius:2px;margin:2px 0}
.branchzones{position:absolute;inset:0;background:rgba(7,7,9,.78);backdrop-filter:blur(2px);display:none;flex-direction:column;
  gap:12px;padding:24px 18px;z-index:var(--z-overlay)}
.branchzones.open{display:flex}
.branchzones h3{font-size:14px;color:var(--text-2);font-weight:600;text-align:center}
.bzone{flex:1;border:2px dashed var(--gold);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:6px;background:var(--gold-dim);font-weight:700;font-size:16px;transition:transform .15s var(--ease)}
.bzone.hot{transform:scale(1.03);background:rgba(197,160,89,.3)}
.bzone .bsub{font-size:12px;font-weight:500;color:var(--text-2)}

/* ===== drag ghost ===== */
.dragghost{position:fixed;pointer-events:none;z-index:var(--z-menu);width:240px;opacity:.95;transform:rotate(-2deg);
  filter:drop-shadow(0 12px 24px rgba(0,0,0,.6))}

/* ===== slide-over / sheet ===== */
.overlay{position:absolute;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .2s var(--ease);z-index:var(--z-overlay)}
.overlay.open{opacity:1;pointer-events:auto}
.sheet{position:absolute;background:var(--surface);z-index:var(--z-sheet);box-shadow:0 -10px 40px rgba(0,0,0,.5);
  display:flex;flex-direction:column;transition:transform .26s var(--ease)}
.sheet.bottom{left:0;right:0;bottom:0;border-radius:20px 20px 0 0;max-height:88%;transform:translateY(110%)}
.sheet.bottom.open{transform:translateY(0)}
.sheet.right{top:0;right:0;bottom:0;width:340px;max-width:88%;transform:translateX(110%)}
.sheet.right.open{transform:translateX(0)}
.sheet .sh{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--divider);flex:none}
.sheet .sh .st{font-weight:700;font-size:16px;flex:1;min-width:0}
.sheet .sb{padding:16px;overflow-y:auto;flex:1}
.grabber{width:38px;height:4px;background:var(--divider);border-radius:2px;margin:8px auto 0}

/* ===== forms ===== */
.fld{margin-bottom:14px}
.fld label{display:block;font-size:11.5px;color:var(--text-2);font-weight:600;margin-bottom:6px}
.fld input,.fld select,.fld textarea{width:100%;background:var(--input);border:1px solid var(--divider);border-radius:10px;
  color:var(--text);font-size:14px;padding:11px 12px;outline:none}
.fld input:focus,.fld select:focus{border-color:var(--gold)}
.optrow{display:flex;gap:8px;flex-wrap:wrap}
.dur-presets{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.conflict{display:flex;gap:9px;align-items:flex-start;background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.4);
  border-radius:10px;padding:10px 12px;font-size:12.5px;color:#ffb4b4;margin-bottom:14px}

/* ===== menu / popover ===== */
.menu{position:absolute;background:var(--surface-2);border:1px solid var(--divider);border-radius:12px;padding:6px;
  z-index:var(--z-menu);box-shadow:0 14px 40px rgba(0,0,0,.55);min-width:210px;max-width:min(280px,86vw);display:none}
.menu.open{display:block}
.menu button{display:flex;align-items:center;gap:11px;width:100%;padding:10px 12px;border-radius:9px;font-size:13.5px;
  font-weight:500;color:var(--text);text-align:left}
.menu button .mlbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu button:hover{background:var(--surface)}
.menu button.danger{color:#ff9a9a}
.menu .sep{height:1px;background:var(--divider);margin:5px 6px}

/* ===== client card / profile ===== */
.profhead{display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 16px;text-align:center}
.profhead .bigav{width:78px;height:78px;border-radius:50%;font-size:28px}
.profhead .pn{font-weight:700;font-size:19px}
.profhead .pr{font-size:12.5px;color:var(--text-2)}
.unsaved{display:flex;gap:9px;align-items:center;background:rgba(245,166,35,.12);border:1px solid rgba(245,166,35,.4);
  border-radius:10px;padding:10px 12px;font-size:12.5px;color:#f5d199;margin:0 16px 14px}
.infoline{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--divider)}
.infoline .il-l{font-size:11px;color:var(--text-3);width:84px;flex:none}
.infoline .il-v{flex:1;min-width:0;font-size:14px}
.callbtn{width:38px;height:38px;border-radius:50%;background:var(--gold-dim);color:var(--gold);display:grid;place-items:center;flex:none}
.callbtn:hover{background:rgba(197,160,89,.28)}
.sectn{padding:14px 16px}
.sectn h4{font-size:12px;color:var(--text-3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;font-weight:700}
.histitem{display:flex;gap:10px;padding:8px 0}
.histdot{width:9px;height:9px;border-radius:50%;background:var(--gold);margin-top:5px;flex:none}
.famitem{display:flex;align-items:center;gap:10px;padding:8px 0}

/* ===== users table ===== */
.utable{padding:12px;display:flex;flex-direction:column;gap:8px}
.urow{display:grid;grid-template-columns:42px minmax(0,1.6fr) minmax(0,1fr) minmax(0,1fr) auto;gap:12px;align-items:center;
  background:var(--surface);border:1px solid var(--divider);border-radius:12px;padding:10px 12px}
.phone .urow{grid-template-columns:42px minmax(0,1fr) auto;gap:10px}
.urow .un{font-weight:600;font-size:14px}
.urow .ue{font-size:11.5px;color:var(--text-2)}
.urow .ucol{min-width:0}
.urow .urole{font-size:12px}
.phone .urow .hide-m{display:none}
.phone .urow .show-m{display:inline-flex!important}
.rolepill{font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;background:var(--gold-dim);color:var(--gold);white-space:nowrap}

/* ===== reports / finance / tasks ===== */
.grid-cards{padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;overflow-y:auto}
.phone .grid-cards{grid-template-columns:1fr}
.rcard{background:var(--surface);border:1px solid var(--divider);border-radius:16px;padding:15px;min-width:0}
.rcard h5{font-size:13px;color:var(--text-2);font-weight:600;margin-bottom:4px}
.rcard .big{font-size:26px;font-weight:800}
.rcard .delta{font-size:12px;font-weight:600;margin-top:2px}
.delta.up{color:var(--online)}.delta.down{color:var(--danger)}
.bars{display:flex;align-items:flex-end;gap:6px;height:74px;margin-top:12px}
.bars i{flex:1;background:var(--gold);border-radius:4px 4px 0 0;min-height:4px;opacity:.85}
.funnel{display:flex;flex-direction:column;gap:7px;margin-top:10px}
.funnel .fr{display:flex;align-items:center;gap:10px}
.funnel .fbar{height:26px;border-radius:7px;background:var(--gold);display:flex;align-items:center;padding:0 9px;
  color:#1a1407;font-weight:700;font-size:12px;min-width:42px}
.funnel .fl{width:96px;font-size:12px;color:var(--text-2);flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spark{margin-top:12px}
.tasklist{padding:14px;display:flex;flex-direction:column;gap:9px;overflow-y:auto}
.task{display:flex;align-items:flex-start;gap:11px;background:var(--surface);border:1px solid var(--divider);border-radius:12px;padding:12px}
.task .chk{width:22px;height:22px;border-radius:7px;border:2px solid var(--divider);flex:none;margin-top:1px;display:grid;place-items:center}
.task.done .chk{background:var(--gold);border-color:var(--gold);color:#1a1407}
.task.done .tt{text-decoration:line-through;color:var(--text-3)}
.task .tt{font-weight:600;font-size:14px}
.task .tm{font-size:11.5px;color:var(--text-2);margin-top:3px}

/* ===== my school (client) ===== */
.mscard{margin:14px;background:linear-gradient(135deg,#1f1a12,#15130f);border:1px solid rgba(197,160,89,.3);border-radius:18px;padding:18px}
.mscard .mlabel{font-size:11px;color:var(--gold);font-weight:700;text-transform:uppercase;letter-spacing:.6px}
.mscard .mbig{font-size:30px;font-weight:800;margin-top:6px}
.progress{height:8px;border-radius:999px;background:var(--input);margin-top:14px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--gold);border-radius:999px}
.mssec{padding:6px 14px}
.mssec h4{font-size:13px;font-weight:700;margin:12px 4px 8px}
.lessrow{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--divider);border-radius:12px;padding:12px;margin-bottom:9px}
.lessrow .ld{width:46px;text-align:center;flex:none}
.lessrow .ld .dn{font-size:18px;font-weight:800;color:var(--gold)}
.lessrow .ld .dm{font-size:10px;color:var(--text-2)}
.hw{display:flex;gap:10px;background:var(--surface);border:1px solid var(--divider);border-radius:12px;padding:12px;margin-bottom:9px}
.hw .hwchk{width:20px;height:20px;border-radius:6px;border:2px solid var(--divider);flex:none;margin-top:2px}
.hw.done .hwchk{background:var(--online);border-color:var(--online)}

/* ===== toast ===== */
.toast{position:absolute;bottom:84px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--surface-2);
  border:1px solid var(--divider);color:var(--text);font-size:13px;font-weight:500;padding:11px 18px;border-radius:999px;
  z-index:var(--z-toast);opacity:0;pointer-events:none;transition:all .22s var(--ease);box-shadow:0 8px 30px rgba(0,0,0,.5);max-width:84%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:10px;color:var(--text-3);padding:30px;text-align:center}
.hidden{display:none!important}
</style>

};
const STAFF = r => r==='manager'||r==='admin';

/* =================== STATE =================== */
const S = {
  role:'manager', frame:'phone', win:'chat',
  openChat:null, clientsTab:'leads', clientsBranch:null,
  schedView:'room', selStart:null, selEnd:null, selCol:null,
  drag:null, // {card, fromCol, fromKey}
};

/* =================== HELPERS =================== */
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const el = (tag,cls,html)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;};
function toast(msg){
  let t=$('#toast'); if(!t){t=el('div','toast');t.id='toast';$('#viewport').appendChild(t);}
  t.textContent=msg; t.classList.add('show'); clearTimeout(t._tm); t._tm=setTimeout(()=>t.classList.remove('show'),1900);
}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

/* =================== TOP CONTROLS =================== */
function renderRoleSeg(){
  const seg=$('#roleSeg'); seg.innerHTML='';

$$('#frameSeg button').forEach(b=>b.onclick=()=>{

/* =================== MASTER RENDER =================== */
function render(){

function STAFF_DESKTOP(){return true;}

/* ---------- MOBILE SHELL ---------- */
function renderMobile(vp){
  const app=el('div','app');

function topActionFor(win){
  if(win==='clients'&&!S._clientCard){

/* =================== WINDOW ROUTER =================== */
function renderWindow(){
  switch(S.win){
    case 'chat': return renderChat();
    case 'schedule': return renderSchedule();

    case 'mystudents': return renderMyStudents();
    case 'users': return renderUsers();

/* =================== CHAT =================== */
function chatsForRole(){ return STAFF(S.role)?STAFF_CHATS : CLIENT_CHATS; }
function renderChat(){
  const chats=chatsForRole();
  const wrap=el('div','chatwrap');
  // list
  const list=el('div','chatlist');
  const search=el('div','search',I.search+'<input placeholder="Поиск чатов" id="chatSearch">');
  list.appendChild(search);
  const cl=el('div','convlist'); cl.id='convlist';
  function paint(q=''){
    cl.innerHTML='';
    chats.filter(c=>c.name.toLowerCase().includes(q.toLowerCase())).forEach(c=>{
      const conv=el('div','conv'+(S.openChat===c.id?' on':''));
      const last = c.msg.startsWith('voice|')?'🎤 Голосовое сообщение':c.msg;
      conv.innerHTML=`<div class="avwrap"><div class="avatar ${c.cls}">${c.av}</div>${c.online?'<span class="dot-on"></span>':''}</div>
        <div class="cmid"><div class="cname"><span class="ellipsis">${esc(c.name)}</span><span class="t">${c.t}</span></div>
        <div class="cmsg">${esc(last)}</div></div>${c.unread?`<span class="unread">${c.unread}</span>`:''}`;
      conv.onclick=()=>{S.openChat=c.id;c.unread=0;render();};
      cl.appendChild(conv);
    });
    if(!cl.children.length)cl.appendChild(el('div','empty','Ничего не найдено'));
  }
  paint();
  search.querySelector('input').oninput=e=>paint(e.target.value);
  list.appendChild(cl);

  // thread
  const thread=buildThread(chats);
  if(S.frame==='phone'){
    if(S.openChat){wrap.appendChild(thread);} else {wrap.appendChild(list);}
  } else {
    wrap.appendChild(list);
    wrap.appendChild(S.openChat?thread:el('div','empty',I.chat+'<div>Выберите чат, чтобы начать общение</div>'));
  }
  return wrap;
}
function buildThread(chats){
  const c=chats.find(x=>x.id===S.openChat); if(!c)return el('div','empty','Чат');
  const t=el('div','thread');
  const head=el('div','chathead');
  const back=el('button','back icobtn',I.back); back.onclick=()=>{S.openChat=null;render();};
  head.appendChild(back);
  head.innerHTML+=`<div class="avwrap"><div class="avatar ${c.cls}">${c.av}</div>${c.online?'<span class="dot-on"></span>':''}</div>
    <div class="cmid"><div class="cname ellipsis">${esc(c.name)}</div><div class="cstat">${c.online?'в сети':'был(а) недавно'}</div></div>`;
  // CALL ICON only in chat header, staff only, when phone exists.
  // I1: no call icon anywhere on desktop — call icon is phone-only (chat header + open card).
  if(STAFF(S.role)&&c.phone&&S.frame==='phone'){
    const call=el('a','icobtn'); call.href='tel:'+c.phone.replace(/\s/g,''); call.innerHTML=I.phone; call.title='Позвонить '+c.phone;
    call.style.color='var(--gold)';
    head.appendChild(call);
  }
  const more=el('button','icobtn',I.dots); more.onclick=e=>openChatMenu(e,c); head.appendChild(more);
  t.appendChild(head);

  const msgs=el('div','msgs');
  msgs.appendChild(el('div','daysep','Сегодня'));
  c.log.forEach(([dir,text,time])=>{
    const m=el('div','msg '+(dir==='out'?'out':'in'));
    if(text.startsWith('voice|')){
      const dur=text.split('|')[1];
      m.appendChild(voicePlayer(dur,dir));
    } else {
      m.innerHTML=`<div>${esc(text)}</div><div class="mt">${time} ${dir==='out'?'✓✓':''}</div>`;
    }
    msgs.appendChild(m);
  });
  t.appendChild(msgs);

  // composer
  const comp=el('div','composer');
  const emoji=el('button','icobtn',I.smile);
  const field=el('div','field');
  field.innerHTML=`<input id="msgInput" placeholder="Сообщение"><button class="icobtn" id="clipBtn" style="width:32px;height:32px">${I.clip}</button>`;
  const send=el('button','send',I.send);
  comp.append(emoji,field,send);
  t.appendChild(comp);

  // emoji bar
  const eb=el('div','emojibar');
  '😀😁😂🥰😍🙏👍🎵🎸🎹🎤🎻🥁🔥✅❤️👏😎🤝🎉'.split('').filter(x=>x.trim()).forEach(()=>{});
  ['😀','😁','😂','🥰','😍','🙏','👍','🎵','🎸','🎹','🎤','🎻','🥁','🔥','✅','❤️','👏','😎','🤝','🎉'].forEach(em=>{
    const b=el('button','',em); b.onclick=()=>{const inp=$('#msgInput');inp.value+=em;inp.focus();}; eb.appendChild(b);
  });
  t.appendChild(eb);
  // attach sheet
  const at=el('div','attachsheet');
  at.innerHTML=`<button>${I.img}<span>Галерея устройства</span></button>
    <button>${I.cam}<span>Камера</span></button>
    <button>${I.doc}<span>Документ</span></button>`;
  $$('button',at).forEach(b=>b.onclick=()=>{at.classList.remove('open');toast('Открыта '+b.textContent.trim().toLowerCase()+' (как в Telegram)');});
  t.appendChild(at);

  emoji.onclick=()=>{at.classList.remove('open');eb.classList.toggle('open');};
  field.querySelector('#clipBtn').onclick=()=>{eb.classList.remove('open');at.classList.toggle('open');};
  function doSend(){
    const inp=$('#msgInput'); const v=inp.value.trim(); if(!v)return;
    const m=el('div','msg out',`<div>${esc(v)}</div><div class="mt">сейчас ✓</div>`);
    msgs.appendChild(m); inp.value=''; eb.classList.remove('open'); msgs.scrollTop=msgs.scrollHeight;
    setTimeout(()=>{ const r=el('div','msg in',`<div>Принято, спасибо! 👍</div><div class="mt">сейчас</div>`); msgs.appendChild(r); msgs.scrollTop=msgs.scrollHeight; },800);
  }
  send.onclick=doSend;
  field.querySelector('input').addEventListener('keydown',e=>{if(e.key==='Enter')doSend();});
  setTimeout(()=>msgs.scrollTop=msgs.scrollHeight,30);
  return t;
}
function voicePlayer(dur,dir){
  const v=el('div','voice');
  const play=el('div','play',I.play);
  const wave=el('div','wave');
  const heights=[8,14,20,12,18,24,10,16,22,9,15,19,11,21,13,17,8,20,12,16];
  heights.forEach(h=>{const i=el('i');i.style.height=h+'px';wave.appendChild(i);});
  const vt=el('span','vt',dur);
  v.append(play,wave,vt);
  let playing=false,raf;
  play.onclick=()=>{
    playing=!playing; play.innerHTML=playing?'<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/></svg>':I.play;
    if(playing){
      toast('▶ Воспроизведение голосового'); let i=0;
      const bars=$$('i',wave);
      raf=setInterval(()=>{bars.forEach((b,k)=>b.style.opacity=k<=i?'1':'.4');i++;if(i>bars.length){clearInterval(raf);playing=false;play.innerHTML=I.play;bars.forEach(b=>b.style.opacity='.55');}},120);
    } else { clearInterval(raf); }
  };
  return v;
}
function openChatMenu(e,c){

/* =================== SCHEDULE =================== */
function renderSchedule(){
  const wrap=el('div','dcol');
  wrap.style.position='relative';
  const tb=el('div','schtoolbar');
  tb.innerHTML=`<div class="mh">Август 2026</div>`;

  vs.innerHTML=`<button data-v="room" class="${S.schedView==='room'?'on':''}">Залы</button>
    <button data-v="teacher" class="${S.schedView==='teacher'?'on':''}">Преподаватели</button>`;
  $$('button',vs).forEach(b=>b.onclick=()=>{S.schedView=b.dataset.v;render();});
  tb.appendChild(vs);
  wrap.appendChild(tb);

  const cols = S.schedView==='room'?ROOMS:TEACHERS;
  const lessons = SCHED[S.schedView];
  const calwrap=el('div','calwrap');
  const grid=el('div','grid');
  grid.style.gridTemplateColumns=`58px repeat(${cols.length},minmax(118px,1fr))`;
  // header row
  grid.appendChild(el('div','colhead timecol-h','Время'));
  cols.forEach(c=>grid.appendChild(el('div','colhead',`${esc(c)}<div class="sub">${S.schedView==='room'?'кабинет':'преп.'}</div>`)));
  // time rows
  TIMES.forEach((time,ri)=>{
    grid.appendChild(el('div','timecell',time));
    cols.forEach((c,ci)=>{

      bindSlot(slot,ci,ri);
      grid.appendChild(slot);
    });
  });
  calwrap.appendChild(grid);
  wrap.appendChild(calwrap);

  // render lessons absolutely once grid is in DOM
  setTimeout(()=>placeLessons(grid,cols,lessons),0);
  return wrap;
}
function placeLessons(grid,cols,lessons){
  const slots=$$('.slot',grid);
  if(!slots.length)return;
  const sample=slots[0];
  const rowH=sample.offsetHeight;
  const colW=sample.offsetWidth;
  const headH=$('.colhead',grid).offsetHeight;
  lessons.forEach(L=>{
    const left = 58 + L.col*colW + 3;
    const top = headH + L.start*rowH + 2;
    const isPartial = L.span%1!==0;
    const h = L.span*rowH - 4;
    const les=el('div','lesson'+(isPartial?' partial':''));
    les.style.cssText=`left:${left}px;top:${top}px;width:${colW-6}px;height:${h}px`;
    const endMin = Math.round((L.span%1)*60);
    const startH = 9+L.start;
    const endH = 9+Math.floor(L.start+L.span);
    const durLabel = (L.span%1===0)?`${L.span}:00`:`${Math.floor(L.span)}:${String(endMin).padStart(2,'0')}`;
    les.innerHTML=`<div class="ellipsis">${esc(L.title)}</div><div class="ls">${esc(L.who)} · ${durLabel}${isPartial?' ⏱':''}</div>`;
    les.onclick=ev=>{ev.stopPropagation();openLessonCard(L);};
    grid.appendChild(les);
  });
}
function bindSlot(slot,ci,ri){
  let dragging=false, startRow=ri;
  slot.addEventListener('pointerdown',e=>{
    dragging=true; startRow=ri; S.selCol=ci;
    clearSel(); markSel(ci,ri,ri);
    slot.setPointerCapture&&slot.setPointerCapture(e.pointerId);
  });
  slot.addEventListener('pointerenter',()=>{
    if(dragging&&S.selCol===ci){ markSel(ci,startRow,ri); }
  });
  slot.addEventListener('pointerup',e=>{
    if(!dragging)return; dragging=false;
    const a=Math.min(startRow,getHover(slot));
    const sel=$$('.slot.sel');
    if(sel.length){
      const rows=sel.map(s=>+s.dataset.row);
      const start=Math.min(...rows), end=Math.max(...rows);
      openBooking(ci,start,end-start+1);
    }
  });
}
function getHover(slot){return +slot.dataset.row;}
function clearSel(){$$('.slot.sel').forEach(s=>s.classList.remove('sel'));}
function markSel(ci,a,b){
  clearSel();
  const lo=Math.min(a,b),hi=Math.max(a,b);
  for(let r=lo;r<=hi;r++){const s=document.querySelector(`.slot[data-col="${ci}"][data-row="${r}"]`);if(s)s.classList.add('sel');}
}
function openLessonCard(L){
  const sheet=makeSheet('Занятие',S.frame==='phone'?'bottom':'right');
  const startH=9+L.start;
  const sb=$('.sb',sheet);
  const dur=(L.span%1===0)?`${L.span}:00`:`${Math.floor(L.span)}:${String(Math.round((L.span%1)*60)).padStart(2,'0')}`;
  sb.innerHTML=`<div class="infoline"><div class="il-l">Название</div><div class="il-v ellipsis">${esc(L.title)}</div></div>
    <div class="infoline"><div class="il-l">${S.schedView==='room'?'Преподаватель':'Зал'}</div><div class="il-v">${esc(L.who)}</div></div>
    <div class="infoline"><div class="il-l">Время</div><div class="il-v">${String(startH).padStart(2,'0')}:00 · ${dur}</div></div>
    <div class="infoline"><div class="il-l">Ученик</div><div class="il-v ellipsis">${esc(L.title.split('—')[0].trim()||'Группа')}</div></div>
    <div style="display:flex;gap:9px;margin-top:16px"><button class="btn gold" style="flex:1">Редактировать</button><button class="btn ghost" style="flex:1">Перенести</button></div>`;
  $$('button.btn',sb).forEach(b=>b.onclick=()=>toast(b.textContent+': '+L.title));

/* =================== BOOKING SHEET =================== */
function openBooking(col,start,spanBlocks){
  const sheet=makeSheet('Новое занятие',S.frame==='phone'?'bottom':'right');
  const sb=$('.sb',sheet);
  const cols=S.schedView==='room'?ROOMS:TEACHERS;
  const startH=9+start;
  // DEFAULT duration = exact selected span (I8)
  const defH = spanBlocks; // whole hours
  const defLabel = `${defH}:00`;
  sb.innerHTML=`
    <div id="conflictBox"></div>
    <div class="fld"><label>Ученик / группа</label>
      <select id="bkStudent"><option>Алиса Краева</option><option>Кирилл Лунёв</option><option>Группа «Вокал»</option><option>Новый ученик…</option></select></div>
    <div class="fld"><label>Преподаватель</label>
      <select id="bkTeacher">${TEACHERS.map(t=>`<option>${t}</option>`).join('')}</select></div>
    <div class="fld"><label>Зал</label>
      <select id="bkRoom">${ROOMS.map((r,i)=>`<option ${i===col&&S.schedView==='room'?'selected':''}>${r}</option>`).join('')}</select></div>
    <div class="fld"><label>Начало</label>
      <input id="bkStart" value="${String(startH).padStart(2,'0')}:00" readonly></div>
    <div class="fld"><label>Длительность</label>
      <input id="bkDur" value="${defLabel}">
      <div class="dur-presets" id="durPresets"></div>
      <div style="font-size:11px;color:var(--text-3);margin-top:8px">Выбран диапазон: ${spanBlocks} ч. По умолчанию длительность = точный диапазон. Введите дробное (напр. 1:45) для частичного блока.</div></div>
    <button class="btn gold" id="bkSave" style="width:100%;margin-top:6px">Создать занятие</button>`;
  // presets
  const pre=$('#durPresets',sb);
  ['1:00','1:30','1:45','2:00','2:45','3:00'].forEach(p=>{
    const c=el('button','chip'+(p===defLabel?' on':''),p);
    c.onclick=()=>{$('#bkDur',sb).value=p;$$('.chip',pre).forEach(x=>x.classList.remove('on'));c.classList.add('on');checkConflict();};
    pre.appendChild(c);
  });
  function parseDur(v){const m=v.match(/(\d+):?(\d{0,2})/);if(!m)return 1;return (+m[1])+((+m[2]||0)/60);}
  function checkConflict(){
    const box=$('#conflictBox',sb);
    // simulate: 14:00 Зал 1 busy
    const room=$('#bkRoom',sb).value, st=$('#bkStart',sb).value;
    const busy = (room==='Зал 1' && (startH>=10&&startH<=12)) || (room==='Зал 2'&&startH===11);
    box.innerHTML = busy?`<div class="conflict">${I.warn}<div>Конфликт: ${esc(room)} занят в ${st}. Выберите другое время или зал.</div></div>`:'';
  }
  $('#bkDur',sb).oninput=()=>{$$('.chip',pre).forEach(x=>x.classList.remove('on'));};
  $('#bkRoom',sb).onchange=checkConflict;
  checkConflict();
  $('#bkSave',sb).onclick=()=>{
    const dur=parseDur($('#bkDur',sb).value);
    const partial=dur%1!==0;
    closeSheet(sheet);
    toast(partial?`Занятие создано · ${$('#bkDur',sb).value} (частичный блок ${Math.round((dur%1)*60)}/60)`:`Занятие создано · ${$('#bkDur',sb).value}`);
    clearSel();
  };

/* ---------- DRAG (in-kanban reorder + cross-window transfer) ---------- */
function enableCardDrag(card,c,colName,kind){
  let down=null, ghost=null, moved=false;
  card.addEventListener('pointerdown',e=>{
    if(e.target.closest('[data-more]'))return;
    down={x:e.clientX,y:e.clientY}; moved=false;
    const onMove=ev=>{
      if(!down)return;
      const dx=ev.clientX-down.x, dy=ev.clientY-down.y;
      if(!moved && Math.hypot(dx,dy)<8) return; // drag threshold (E1 fix)
      if(!moved){
        moved=true; card.classList.add('lift');
        ghost=card.cloneNode(true); ghost.className='card dragghost';
        document.body.appendChild(ghost);
        S.drag={c,colName,kind};
      }
      ghost.style.left=(ev.clientX-110)+'px'; ghost.style.top=(ev.clientY-20)+'px';
      handleDragOver(ev,kind);
    };
    const onUp=ev=>{
      document.removeEventListener('pointermove',onMove);
      document.removeEventListener('pointerup',onUp);
      if(moved){ ghost&&ghost.remove(); card.classList.remove('lift'); finishDrop(ev); }
      down=null; S.drag=null; clearDropFX();
    };
    document.addEventListener('pointermove',onMove);
    document.addEventListener('pointerup',onUp);
  });
}
let _dwellTimer=null, _dwellTab=null;
function handleDragOver(ev,kind){
  const vp=$('#viewport');
  const elc=document.elementFromPoint(ev.clientX,ev.clientY);
  clearDropFX();
  // expand segmented tabs in place if hovering near them
  const seg=$('#clientSeg');
  if(seg){
    const segBtns=$$('button',seg);
    let overTab=null;
    segBtns.forEach(b=>{const r=b.getBoundingClientRect();
      if(ev.clientX>=r.left&&ev.clientX<=r.right&&ev.clientY>=r.top-14&&ev.clientY<=r.bottom+14){overTab=b;b.classList.add('dropzone');}});
    // dwell-debounced switch to Ученики
    if(overTab&&overTab.dataset.tab==='students'&&kind==='leads'){
      if(_dwellTab!=='students'){ _dwellTab='students'; clearTimeout(_dwellTimer);
        _dwellTimer=setTimeout(()=>{ if(S.drag){ S.clientsTab='students'; S.clientsBranch=null; render(); setTimeout(()=>{const bz=$('#branchZones');bz&&bz.classList.add('open');},20);} },420); }
    } else if(!overTab){ _dwellTab=null; clearTimeout(_dwellTimer); }
  }
  // branch zones
  const bz=$('#branchZones');
  if(bz&&bz.classList.contains('open')){
    $$('.bzone',bz).forEach(z=>{const r=z.getBoundingClientRect();
      const hot=ev.clientX>=r.left&&ev.clientX<=r.right&&ev.clientY>=r.top&&ev.clientY<=r.bottom;
      z.classList.toggle('hot',hot);});
  }
  // in-kanban column highlight + insertion indicator
  const kcards=elc&&elc.closest('.kcards');
  if(kcards){ kcards.closest('.kcol').classList.add('drop'); }
}
function clearDropFX(){
  $$('.segctl button').forEach(b=>b.classList.remove('dropzone'));
  $$('.kcol.drop').forEach(k=>k.classList.remove('drop'));
}
function finishDrop(ev){
  const {c,colName,kind}=S.drag||{};
  const bz=$('#branchZones');
  if(bz&&bz.classList.contains('open')){
    const hot=$$('.bzone',bz).find(z=>z.classList.contains('hot'));
    if(hot){ bz.classList.remove('open'); S.clientsBranch=hot.dataset.branch; render();
      toast(`«${c.name}» перенесён в Ученики · ${hot.dataset.branch}. Выберите колонку.`); return; }
    bz.classList.remove('open'); return;
  }
  const elc=document.elementFromPoint(ev.clientX,ev.clientY);
  const kcards=elc&&elc.closest('.kcards');
  if(kcards){
    const targetCol=kcards.dataset.col;
    if(targetCol&&targetCol!==colName){
      toast(`«${c.name}» → ${targetCol}`);
    } else { toast('Карточка перемещена'); }
  }
}

      row.onclick=()=>jumpToCard(u);
      table.appendChild(row);
    });
  }
  paint();
  bar.querySelector('input').oninput=e=>paint(e.target.value);
  sc.appendChild(table);
  wrap.appendChild(sc);
  return wrap;
}
function jumpToCard(u){
  // A2: jump to related card
  toast(`Переход к карточке: ${u.role} «${u.name}»`);
}
function openUserMenu(e,u){
  const m=el('div','menu');
  // I9: role change ONLY for manager
  let html=`<button><span class="mlbl">Открыть связанную карточку (${esc(u.role)})</span>${I.arrow}</button>`;
  if(S.role==='manager'){
    html+=`<div class="sep"></div><div style="padding:6px 12px;font-size:11px;color:var(--text-3);font-weight:700">ИЗМЕНИТЬ РОЛЬ</div>`;
    ['Управляющий','Администратор','Преподаватель','Сотрудник','Ученик','Лид'].forEach(r=>{
      html+=`<button data-role="${r}"><span class="mlbl">${r}${r===u.role?' ✓':''}</span></button>`;
    });
  } else {
    html+=`<div class="sep"></div><button disabled style="opacity:.4;cursor:not-allowed"><span class="mlbl">Изменение роли недоступно</span></button>`;
  }
  m.innerHTML=html;
  $$('button',m).forEach(b=>{
    if(b.disabled)return;
    b.onclick=()=>{
      if(b.dataset.role){ u.role=b.dataset.role; toast(`Роль «${u.name}» → ${b.dataset.role}`); closeAllMenus(); $('#userSearch')&&render(); }
      else { jumpToCard(u); closeAllMenus(); }
    };
  });
  showMenu(m,e);
}

function sparkSVG(pts){
  const w=240,h=54,max=Math.max(...pts);
  const step=w/(pts.length-1);
  const d=pts.map((p,i)=>`${i?'L':'M'}${(i*step).toFixed(0)},${(h-(p/max)*h).toFixed(0)}`).join(' ');
  return `<div class="spark"><svg width="100%" height="54" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <path d="${d}" fill="none" stroke="#C5A059" stroke-width="2.5" stroke-linecap="round"/></svg></div>`;
}

/* =================== SHEETS / MENUS INFRA =================== */
function makeSheet(title,pos){
  const vp=$('#viewport');
  const ov=el('div','overlay'); ov.onclick=()=>{closeSheet(sheet);};
  const sheet=el('div','sheet '+pos);
  const grab = pos==='bottom'?'<div class="grabber"></div>':'';
  sheet.innerHTML=grab+`<div class="sh"><div class="st ellipsis">${esc(title)}</div><button class="icobtn" data-close>${I.x}</button></div><div class="sb scroll"></div>`;
  sheet.querySelector('[data-close]').onclick=()=>closeSheet(sheet);
  vp.append(ov,sheet);
  sheet._ov=ov;
  return sheet;
}
function showSheet(sheet){requestAnimationFrame(()=>{sheet._ov.classList.add('open');sheet.classList.add('open');});}
function closeSheet(sheet){sheet.classList.remove('open');sheet._ov.classList.remove('open');setTimeout(()=>{sheet.remove();sheet._ov.remove();},280);}

function showMenu(m,e){
  closeAllMenus();
  $('#viewport').appendChild(m);
  m.classList.add('open');
  const vpr=$('#viewport').getBoundingClientRect();
  let x=e.clientX-vpr.left, y=e.clientY-vpr.top;
  const mw=m.offsetWidth,mh=m.offsetHeight;
  if(x+mw>vpr.width-8)x=vpr.width-mw-8;
  if(y+mh>vpr.height-8)y=vpr.height-mh-8;
  if(x<8)x=8; if(y<8)y=8;
  m.style.left=x+'px'; m.style.top=y+'px';
  setTimeout(()=>{document.addEventListener('pointerdown',outside);},0);
  function outside(ev){ if(!m.contains(ev.target)){closeAllMenus();document.removeEventListener('pointerdown',outside);} }
}
function closeAllMenus(){$$('.menu').forEach(m=>m.remove());}

// Deep-link support: #role=manager&frame=desktop&win=reports (also used for verification)
function applyHash(){
  const h=new URLSearchParams(location.hash.slice(1));
  const r=h.get('role'); if(r&&ROLES[r])S.role=r;
  const f=h.get('frame'); if(f==='phone'||f==='desktop')S.frame=f;
  const w=h.get('win');
  if(S.frame==='phone'){const fr=$('#frame');fr.className='frame phone';}
  else{const fr=$('#frame');fr.className='frame desktop';}
  $$('#frameSeg button').forEach(x=>x.classList.toggle('on',x.dataset.frame===S.frame));
  if(w){const ok=ROLES[S.role].nav.some(n=>n[0]===w); if(ok)S.win=w;} else {S.win=ROLES[S.role].nav[0][0];}
  if(h.get('chat'))S.openChat=h.get('chat');
  if(h.get('tab'))S.clientsTab=h.get('tab');
}
applyHash();
