.stud-screen{position:absolute;inset:0;z-index:var(--z-drawer);background:var(--bg);display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform .3s var(--ease);visibility:hidden}
.stud-screen.show{transform:none;visibility:visible}
.stud-head{flex:none;display:flex;align-items:center;gap:11px;padding:12px 14px;border-bottom:1px solid var(--divider);background:var(--surface)}
.stud-head .ava{width:46px;height:46px;font-size:16px;border-radius:13px}
.stud-head .sh-meta{flex:1;min-width:0}
.stud-head .sh-meta b{font-size:16px;font-weight:700;letter-spacing:-.01em;display:block}
.stud-head .sh-meta small{font-size:12px;color:var(--text-2)}
.stud-tabs{flex:none;display:flex;gap:4px;padding:8px 12px;overflow-x:auto;border-bottom:1px solid var(--divider);background:var(--surface)}
.stud-tabs button{flex:none;height:32px;padding:0 13px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--text-2);white-space:nowrap}
.stud-tabs button.on{background:var(--input);color:#fff;box-shadow:inset 0 0 0 1px var(--gold-line)}
.stud-body{flex:1;min-height:0;overflow:auto;padding:14px 16px 22px}
html[data-frame="desktop"] .stud-body{padding:18px 24px 26px}
.stud-balance{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.stud-balance .sb{flex:1;min-width:120px;background:var(--surface);border:1px solid var(--divider);border-radius:12px;padding:12px 14px}

.sub-progress{background:var(--surface);border:1px solid var(--divider);border-radius:12px;padding:14px 16px}

/* v7 pass-2: first-run onboarding — 2-3 slides → legal consent → enter app */
const OB_SLIDES=[
  {ic:I.clients,title:'Все клиенты в одном месте',text:'Лиды и ученики на доске с перетаскиванием, фильтрами и историей касаний.'},

function onboardingHTML(){

  }
  // legal consent step

  return `<div class="auth-inner">
    <div class="auth-brand"><div class="lm">${ic('<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>',30)}</div>
      <b>Magic<span>Music</span></b><small>Согласие с документами</small></div>
    <p class="auth-note">Чтобы продолжить, подтвердите согласие с легальными документами.</p>
    <div class="consent-list">
      ${row('privacy','Политику конфиденциальности')}
      ${row('terms','Условия использования')}
      ${row('offer','Оферту')}
    </div>
    <div class="auth-err${all?'':' show'}" data-autherr style="${all?'display:none':''}">Отметьте все три документа, чтобы войти</div>
    <button class="btn btn-primary" style="height:46px" data-act="obEnter" ${all?'':'disabled'}>${ic(I.check,17)}Принять и войти</button>
    <div class="auth-link" data-act="toLogin">Назад ко входу</div></div>`;
}
function wireAuth(root){
  const showErr=()=>{ const e=root.querySelector('[data-autherr]'); if(e) e.classList.add('show'); };
  const valOf=k=>{ const el=root.querySelector(`[data-af="${k}"]`); return el?el.value.trim():''; };
  const go=m=>{ ST.authMode=m; syncAuth(); };
  // OTP boxes: auto-advance, backspace, digits only
  const boxes=[...root.querySelectorAll('[data-otpi]')];
  boxes.forEach((bx,i)=>{
    bx.oninput=()=>{ bx.value=bx.value.replace(/\D/g,'').slice(0,1); if(bx.value&&boxes[i+1]) boxes[i+1].focus(); };
    bx.onkeydown=e=>{ if(e.key==='Backspace'&&!bx.value&&boxes[i-1]) boxes[i-1].focus(); };
  });
  if(boxes.length) setTimeout(()=>boxes[0].focus(),60);
  const otpComplete=()=>boxes.length===6 && boxes.every(b=>b.value);

  // v7 pass-2: consent checkbox rows + onboarding nav
  root.querySelectorAll('[data-consent]').forEach(b=>b.onclick=e=>{ if(e.target.closest('[data-consentdoc]'))return;
    const k=b.dataset.consent; ST.obConsent[k]=!ST.obConsent[k]; syncAuth(); });
  root.querySelectorAll('[data-consentdoc]').forEach(b=>b.onclick=e=>{ e.stopPropagation(); toast('Документ',{privacy:'Политика конфиденциальности',terms:'Условия использования',offer:'Оферта'}[b.dataset.consentdoc]); });

  root.querySelectorAll('[data-act]').forEach(b=>{
    const a=b.dataset.act;
    if(a==='toSignup') b.onclick=()=>go('signup');
    if(a==='toLogin')  b.onclick=()=>{ ST.onboarding=false; ST.obSlide=0; ST.obConsent={privacy:false,terms:false,offer:false}; go('login'); };
    if(a==='toForgot') b.onclick=()=>go('forgot');
    if(a==='firstRun') b.onclick=()=>{ ST.onboarding=true; ST.obSlide=0; ST.obConsent={privacy:false,terms:false,offer:false}; syncAuth(); };
    if(a==='obNext')   b.onclick=()=>{ ST.obSlide++; syncAuth(); };
    if(a==='obSkip')   b.onclick=()=>{ ST.obSlide=OB_SLIDES.length; syncAuth(); };
    if(a==='obEnter')  b.onclick=()=>{ const C=ST.obConsent; if(!(C.privacy&&C.terms&&C.offer)){ showErr(); return; }
      ST.onboarding=false; ST.obSlide=0; enterApp(); toast('Добро пожаловать','Согласие принято · приятной работы'); };
    if(a==='doLogin')  b.onclick=()=>{ if(!valOf('login')||!valOf('pass')){ showErr(); return; } enterApp(); };
    if(a==='doSignup') b.onclick=()=>{ if(!valOf('name')||!valOf('login')||!valOf('pass')){ showErr(); return; }
      ST.authCtx={name:valOf('name'),phone:valOf('phone'),login:valOf('login')}; go('otp'); };
    if(a==='doOtp') b.onclick=()=>{ if(!otpComplete()){ showErr(); return; } enterApp(); toast('Аккаунт создан','Код подтверждён · добро пожаловать'); };
    if(a==='doForgot') b.onclick=()=>{ if(!valOf('login')){ showErr(); return; } ST.authCtx={login:valOf('login')}; go('forgotCode'); };
    if(a==='doForgotCode') b.onclick=()=>{ if(!otpComplete()){ showErr(); return; } go('forgotNew'); };
    if(a==='doForgotNew') b.onclick=()=>{ const p=valOf('pass'),p2=valOf('pass2'); if(p.length<6||p!==p2){ showErr(); return; }
      go('login'); toast('Пароль изменён','Войдите с новым паролем'); };
    if(a==='resend') b.onclick=()=>{ const t=root.querySelector('[data-resendtxt]'); if(t) t.textContent='Код отправлен повторно ·'; toast('Код отправлен','Проверьте сообщения'); };
  });
  root.querySelectorAll('[data-demorole]').forEach(b=>b.onclick=()=>{ ST.role=b.dataset.demorole; document.documentElement.dataset.role=ST.role; clampNav(); enterApp(); toast('Вход выполнен',`Роль · ${ROLE_LABEL[ST.role]}`); });
}

function chatListItem(ch,active){

  return `<div class="cl-item${on?' on':''}${ch.muted?' cl-muted':''}" data-chat="${ch.id}">

      <div class="cl-row1"><span class="cl-name">${ch.name}</span><span class="cl-time tnum">${ch.time}</span></div>
      <div class="cl-row2"><span class="cl-prev">${ch.me?'<span class="me">Вы: </span>':''}${ch.prev}</span>

}
function chatPhone(c){
  const m=[...LEADS,...STUDENTS].find(p=>p.name===c.name);
  return m?m.phone:'+7 900 000-00-00';
}
function convHTML(c){
  if(!MSGS[c.id]) MSGS[c.id]=[{sep:'Сегодня'},{in:true,t:'Здравствуйте!',time:'9:00'},{in:false,t:'Добрый день! Чем помочь?',time:'9:01',read:true}];
  const msgs=MSGS[c.id];
  let lastIn=null, body='';
  msgs.forEach((m,i)=>{
    if(m.deleted) return;
    if(m.sep){ body+=`<div class="date-sep">${m.sep}</div>`; lastIn=null; return; }
    const consec = lastIn===m.in;
    lastIn=m.in;
    body+=bubble(m,consec,i);
  });
  return `<div class="conv">
    <div class="conv-head">
      <button class="ch-back" data-act="chatback" aria-label="Назад">${ic(I.back,20)}</button>
      <div class="ava">${initials(c.name)}${c.online?'<span class="odot"></span>':''}</div>
      <div class="ch-meta"><b>${c.name}</b><small class="${c.online?'':'off'}">${c.online?'в сети':'был(а) недавно'}</small></div>
      ${c.kind==='group'?'':`<a class="call-link tip staff-phone" data-tip="Позвонить" href="${telHref(chatPhone(c))}" aria-label="Позвонить ${chatPhone(c)}">${ic(I.phone,18)}</a>`}
      <button class="btn-ghost icon-btn" data-act="chatmenu" aria-label="Меню">${ic(I.dotsV,20)}</button>
    </div>
    <div class="conv-scroll">${body}</div>
    ${ST.replyTo?`<div class="reply-quote" id="replyBar">${ic(I.reply,16)}
      <div class="rq-txt"><b>Ответ · ${ST.replyTo.name}</b><small class="ell">${ST.replyTo.text}</small></div>
      <button class="rq-x" data-act="replyCancel" aria-label="Отменить ответ">${ic(I.close,16)}</button></div>`:''}
    <div class="composer">
      <button class="c-ic" aria-label="Вложение">${ic(I.attach,21)}</button>
      <div class="c-field">
        <input placeholder="Сообщение…">
        <button class="c-ic" style="width:34px;height:34px" aria-label="Эмодзи">${ic(I.emoji,20)}</button>
      </div>
      <button class="c-ic" aria-label="Голос">${ic(I.mic,21)}</button>
      <button class="c-send" aria-label="Отправить">${ic(I.send,19)}</button>
    </div>
  </div>`;
}
function bubble(m,consec,idx){
  const cls = m.in?'in':'out';
  const meta = `<span class="b-meta">${m.time}${!m.in?`${ic(m.read?'<path d="M18 7l-8 8-2-2"/><path d="M22 7l-8 8"/>':'<path d="M20 6L9 17l-5-5"/>',13)}`:''}</span>`;
  const idxAttr = (idx!=null)?` data-msgidx="${idx}"`:'';
  const sel = (idx!=null)?' selectable':'';
  const ed = m.edited?' edited':'';
  // reply-quote shown inside a bubble that answers another message
  const rq = m.reply?`<div class="b-reply"><b>${m.reply.name}</b><div class="ell">${m.reply.text}</div></div>`:'';
  // reaction chips under the bubble
  const rx = (m.reactions&&m.reactions.length)?`<div class="b-reactions">${m.reactions.map(r=>`<span class="rx mine">${r}<span style="opacity:.7">1</span></span>`).join('')}</div>`:'';
  if(m.voice){
    const bars=Array.from({length:22},(_,i)=>`<i style="height:${4+Math.round(Math.abs(Math.sin(i*1.1))*16)}px"></i>`).join('');
    return `<div class="bubble ${cls}${consec?(m.in?' consec-in':' consec-out'):''}${sel}"${idxAttr}>${rq}
      <div class="b-voice"><span class="vp">${ic(I.play,15)}</span><div class="b-wave">${bars}</div><span class="b-vtime tnum">${m.dur}</span></div>${meta}${rx}</div>`;
  }
  return `<div class="bubble ${cls}${consec?(m.in?' consec-in':' consec-out'):''}${sel}${ed}"${idxAttr}>${rq}${m.t}${meta}${rx}</div>`;
}

/* ---------- J4: REPORTS / Отчёты (Управляющий) — funnel·branches·loss·debts·forecast·churn·SLA·weekly ---------- */
function sparkSVG(pts){
  const w=240,h=54,max=Math.max(...pts),step=w/(pts.length-1);
  const d=pts.map((p,i)=>`${i?'L':'M'}${(i*step).toFixed(0)},${(h-(p/max)*h*.9-h*.05).toFixed(0)}`).join(' ');
  return `<div class="spark"><svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <path d="${d}" fill="none" stroke="var(--gold)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>`;
}
function funnel(rows,max,fmt,muted){
  return `<div class="funnel">${rows.map(([l,v])=>`<div class="fr"><span class="fl">${l}</span>
    <div class="ftrack"><div class="fbar${muted?' muted':''}" style="width:${Math.max(8,Math.round(v/max*100))}%">${fmt?fmt(v):v}</div></div></div>`).join('')}</div>`;
}
function lossFunnelRows(){
  // J3: tie the «Причины потерь» report to live lead loss reasons (base demo + actual selections)
  const base={'Дорого':42,'Нет времени':28,'Локация':18,'Другое':12};
  Object.values(ST.lossReasons).forEach(r=>{ if(r in base) base[r]+=3; });
  return Object.entries(base).sort((a,b)=>b[1]-a[1]);
}

/* ============================== POST-RENDER WIRING ============================== */
function postRender(nav){
  wireShell();
  if(nav==='chat'){
    // K14: chat list skeleton on first paint of the list pane, then real items
    if(!(ST.frame==='phone'&&ST.chatPane==='conv')){ skeleton('.cl-scroll','chat'); setTimeout(()=>{ const s=$('.cl-scroll',activeApp());
      if(s){ if(ST.chatSection==='channels'){ const ach=CHANNELS.find(x=>x.id===ST.channelOpen)||CHANNELS[0]; s.innerHTML=CHANNELS.map(c2=>channelListItem(c2,ach)).join(''); }
        else { s.innerHTML=CHATS.map(ch=>chatListItem(ch,ST.chatOpen||CHATS[0])).join(''); } }
      wireChat(); },320); }
    wireChat();
  }
  if(nav==='clients'){ requestAnimationFrame(()=>{ sizeSeg('#clientSeg','tab',ST.clientTab); }); skeleton('#kanbanWrap','kanban'); setTimeout(()=>{ const w=$('#kanbanWrap',activeApp()); if(w){ w.innerHTML='<div class="kanban" id="kanban"></div>'; renderKanban(); } },340); wireClients(); }
  if(nav==='schedule'){
    if(ST.schMode==='year'){ setTimeout(()=>renderYear(),0); requestAnimationFrame(()=>sizeSeg('#schModeSeg','smode',ST.schMode)); wireSchedule(); }
    else if(ST.schMode==='month'){ skeleton('#monthWrap','month'); setTimeout(()=>renderMonth(),360); requestAnimationFrame(()=>sizeSeg('#schModeSeg','smode',ST.schMode)); wireSchedule(); }
    else { skeleton('#gridWrap','grid'); setTimeout(()=>renderGrid(),360); requestAnimationFrame(()=>{ sizeSeg('#schSeg','sview',ST.schView); sizeSeg('#schSegPhone','sview',ST.schView); sizeSeg('#schModeSeg','smode',ST.schMode); }); wireSchedule(); }
  }
  if(nav==='profile') wireProfile();
  if(nav==='myschool') wireProfile();           // J4: client portal reuses kid-switch wiring
  // K14: reports & finance skeleton on load, then real cards
  if(nav==='reports'||nav==='finance'){
    if(nav==='reports') requestAnimationFrame(()=>sizeSeg('#repSeg','reptab',ST.repTab));
    const grid=$('.rep-grid',activeApp());
    if(grid){ const saved=grid.innerHTML;
      grid.innerHTML=Array.from({length:6}).map(()=>`<div class="skel-card" style="min-height:120px"><div class="skel skel-line" style="width:50%"></div><div class="skel skel-line" style="width:35%;height:22px"></div></div>`).join('');
      setTimeout(()=>{ grid.innerHTML=saved; wireRoleViews(nav); },340);
    } else { wireRoleViews(nav); }
  } else if(['tasks','mystudents','myschool','settings'].includes(nav)) wireRoleViews(nav);
  wireUsers();
}
/* J4: keep every added control live — reports/finance cards toast, tasks toggle, homework toggle */
function wireRoleViews(nav){
  const app=activeApp();
  $$('.rcard',app).forEach(c=>{ if(c.hasAttribute('data-noreport'))return; c.onclick=()=>toast('Отчёт',c.dataset.report||c.querySelector('h5')?.textContent); });
  // J5: Отчёты in-window tabs (Аналитика | Финансы | Активность)
  if(nav==='reports'){
    const seg=$('#repSeg',app);
    if(seg) seg.querySelectorAll('.seg-opt').forEach(o=>o.onclick=()=>{ ST.repTab=o.dataset.reptab;
      const body=$('#repBody',app); if(body) body.innerHTML=reportBody();
      sizeSeg('#repSeg','reptab',ST.repTab); wireRoleViews('reports'); });
    if(ST.repTab==='finance') wireFinance(app);
  }
  if(nav==='finance') wireFinance(app);
  if(nav==='settings') wireSettings(app);
  if(nav==='tasks'){
    // filter chips
    $$('[data-tfilter]',app).forEach(c=>c.onclick=()=>{ ST[c.dataset.tfilter]=c.dataset.tval; render(); });
    // toggle done
    $$('[data-task2chk]',app).forEach(b=>b.onclick=e=>{ e.stopPropagation(); const t=TASKS2.find(x=>x.id===b.dataset.task2chk);
      t.done=!t.done; t.status=t.done?'done':'todo'; render(); toast(t.done?'Задача выполнена':'Задача возвращена',t.title); });
    // card → entity timeline sheet
    $$('[data-task2]',app).forEach(r=>r.onclick=e=>{ if(e.target.closest('[data-task2menu]')||e.target.closest('[data-task2chk]'))return;
      openTaskTimeline(TASKS2.find(x=>x.id===r.dataset.task2)); });
    // per-task ⋯ menu (статус, переназначить, открыть таймлайн)
    $$('[data-task2menu]',app).forEach(b=>b.onclick=e=>{ e.stopPropagation(); const t=TASKS2.find(x=>x.id===b.dataset.task2menu);
      openPop(e.currentTarget,[
        {sub:t.title},
        {label:'Открыть таймлайн',icon:I.list,act:()=>openTaskTimeline(t)},
        {label:'Сменить статус',icon:I.edit,act:()=>setTimeout(()=>openPop(b,[{sub:'Статус'},...TASK_STATUSES.map(s=>({label:s.name,icon:I.check,act:()=>{ t.status=s.id; t.done=s.id==='done'; render(); toast('Статус',`${t.title} → ${s.name}`); }}))],true),50)},

/* v7: refresh whichever finance container is on screen, re-wire it */

function openSetEdit(kind,idx,ctx){

    <div class="sheet-head"><div class="icon-badge">${ic(kind==='branch'?I.branch:kind==='room'?I.room:I.teacher,20)}</div>
      <div style="flex:1"><h3>${isNew?'Новый · '+def.label:def.label}</h3><p>${isNew?'Добавить '+def.title:'Изменить '+def.title}</p></div>
      <button class="btn btn-ghost icon-btn" data-close="info">${ic(I.close,20)}</button></div>
    <div class="sheet-body">
      <div class="field"><label>Название</label><input class="inp" id="setName" value="${it.name||''}" placeholder="${def.label}"></div>
      <div class="field"><label>${kind==='branch'?'Адрес':'Специализация'}</label><input class="inp" id="setSub" value="${it.addr||it.sub||''}" placeholder="${kind==='branch'?'ул. …':'Вокал, гитара…'}"></div>
      ${def.hasLink?`<div class="field"><label>${ic(I.link,13)} Связать с ${def.linkKind==='user'?'аккаунтом пользователя':'преподавателем'}</label>
        <select class="sel" id="setLink"><option value="">— не связано —</option>${linkOpts}</select></div>`:''}
    </div>
    <div class="sheet-foot">
      ${isNew?'':`<button class="btn danger" id="setDel">${ic(I.trash,16)}Удалить</button>`}
      <button class="btn btn-primary" style="flex:1" id="setSave">${ic(I.check,17)}${isNew?'Добавить':'Сохранить'}</button></div>`;
  sheet.querySelectorAll('[data-close="info"]').forEach(b=>b.onclick=()=>closeSheet('info'));
  const del=sheet.querySelector('#setDel'); if(del) del.onclick=()=>{ list.splice(idx,1); closeSheet('info'); render(); toast(def.label+' удалён',it.name); };
  sheet.querySelector('#setSave').onclick=()=>{
    const name=sheet.querySelector('#setName').value.trim(); if(!name){ toast('Укажите название',def.label+' без названия'); return; }
    const sub=sheet.querySelector('#setSub').value.trim();

    if(kind==='branch'){ it.name=name; it.addr=sub; if(isNew){ it.count=0; list.push(it); } }
    else { it.name=name; it.sub=sub; it.link=link; if(isNew) list.push(it); }
    closeSheet('info'); render();
    toast(isNew?def.label+' добавлен':def.label+' сохранён',name+(link?' · '+link:''));
  };
  openSheet('info');
}

/* segmented glide sizing */
function sizeSeg(sel,attr,val){
  const seg=$(sel,activeApp()); if(!seg) return;
  const glide=seg.querySelector('.seg-glide'); const on=seg.querySelector(`.seg-opt[data-${attr}="${val}"]`);
  if(!glide||!on) return;
  glide.style.width=on.offsetWidth+'px';

}

/* 2c: voice playback — toggle play/pause, animate progress fill across the waveform with elapsing mm:ss (E2 fix) */
function playVoice(voice){
  if(voice._timer){ // pause
    clearInterval(voice._timer); voice._timer=null; voice.classList.remove('playing');
    const vp=voice.querySelector('.vp'); if(vp) vp.innerHTML=ic(I.play,15);
    return;
  }
  const bars=[...voice.querySelectorAll('.b-wave i')];
  const tEl=voice.querySelector('.b-vtime');
  const dur=voice.dataset.dur||(tEl?tEl.textContent.trim():'0:14');
  const totalSec=(()=>{ const m=(dur.match(/(\d+):(\d+)/)); return m?(+m[1]*60+ +m[2]):14; })();
  voice.dataset.dur=dur;
  voice.classList.add('playing');
  const vp=voice.querySelector('.vp'); if(vp) vp.innerHTML=ic(I.pause,15);
  let prog=voice._prog||0; const step=1/(totalSec*10); // 100ms ticks
  voice._timer=setInterval(()=>{
    prog+=step; voice._prog=prog;
    const filled=Math.round(prog*bars.length);
    bars.forEach((b,i)=>b.classList.toggle('played',i<filled));
    const el=Math.min(totalSec,Math.round(prog*totalSec));
    if(tEl) tEl.textContent=Math.floor(el/60)+':'+String(el%60).padStart(2,'0');
    if(prog>=1){ clearInterval(voice._timer); voice._timer=null; voice._prog=0; voice.classList.remove('playing');
      if(vp) vp.innerHTML=ic(I.play,15); bars.forEach(b=>b.classList.remove('played'));
      if(tEl) tEl.textContent=dur; }
  },100);
}

/* ============================== IN-KANBAN DRAG + CONTINUOUS TRANSFER ============================== */
const DRAG={active:false};
const ghost=$('#dragGhost');
const THRESH=6;
function attachCardDrag(cardEl,item){
  let sx=0,sy=0,moved=false;
  cardEl.addEventListener('pointerdown',e=>{
    if(e.button!==undefined&&e.button!==0)return;
    sx=e.clientX; sy=e.clientY; moved=false;
    const move=ev=>{
      if(!moved&&Math.hypot(ev.clientX-sx,ev.clientY-sy)>THRESH){ moved=true; startDrag(item,cardEl); }
      if(moved){ ev.preventDefault(); moveDrag(ev.clientX,ev.clientY); }
    };
    const up=ev=>{
      window.removeEventListener('pointermove',move);
      if(moved) endDrag(ev.clientX,ev.clientY);
      else if(!ev.target.closest('[data-cardmenu]')) openCard(item,'lead');
    };
    window.addEventListener('pointermove',move);
    window.addEventListener('pointerup',up,{once:true});
  });
}
let dragItem=null,dragSrc=null,overStu=false;
/* ===== H7 dwell machinery (debounced — quick pass-through must NOT trigger) ===== */
const DWELL_MS=350;          // time the card must rest inside a zone before it fires
const DWELL_MOVE_TOL=10;     // px the pointer may jitter and still count as "resting"
let dwell={zone:null,t0:0,x:0,y:0,fired:false,raf:0};
function resetDwell(){ dwell.zone=null; dwell.fired=false; setDwellRing(0);
  const seg=$('#clientSeg',activeApp()); if(seg) seg.querySelectorAll('.seg-opt').forEach(o=>o.classList.remove('dz-hot')); }
function setDwellRing(pct){
  const hot=$('#clientSeg .seg-opt.dz-hot',activeApp()); if(hot) hot.style.setProperty('--dwell',pct+'%');
}
/* called every move while NOT yet in the student board; advances/cancels the dwell timer */
function trackDwell(zoneKey,x,y,onFire){
  if(dwell.zone!==zoneKey){ // entered a new zone → start timing
    dwell.zone=zoneKey; dwell.t0=performance.now(); dwell.x=x; dwell.y=y; dwell.fired=false; setDwellRing(0); return;
  }
  if(Math.hypot(x-dwell.x,y-dwell.y)>DWELL_MOVE_TOL){ // moved too much → it's a pass-through, restart timer
    dwell.t0=performance.now(); dwell.x=x; dwell.y=y; setDwellRing(0); return;
  }
  const el=performance.now()-dwell.t0;
  setDwellRing(Math.min(100,Math.round(el/DWELL_MS*100)));
  if(el>=DWELL_MS && !dwell.fired){ dwell.fired=true; onFire(); }
}
function startDrag(item,src){
  DRAG.active=true; dragItem=item; dragSrc=src; overStu=false; resetDwell();
  src.classList.add('dragging');
  document.documentElement.classList.add('dragging-active');
  ghost.innerHTML=`<div class="card">${cardInner(item,'lead')}</div>`;
  ghost.classList.add('on');
  // G5: arm all in-tab columns with dashed contour
  $$('.kcol',activeApp()).forEach(c=>c.classList.add('drop-arm'));
  // H7: expand the «Лиды | Ученики» segmented control IN PLACE into drop-zones
  const seg=$('#clientSeg',activeApp());
  if(seg){
    seg.classList.add('dz-arm');
    const stu=seg.querySelector('.seg-opt[data-tab="students"]');
    if(stu && !stu.querySelector('.dz-cap')){ stu.insertAdjacentHTML('beforeend','<span class="dz-cap">отпустите для переноса</span>'); }
  }
}
function moveDrag(x,y){
  ghost.style.transform=`translate(${x-118}px,${y-30}px) scale(1.03)`;
  const app=activeApp();
  if(!overStu){
    // H7: is the held card resting inside the «Ученики» drop-zone? (debounced dwell)
    const overStuZone=elAt(x,y,'#clientSeg .seg-opt[data-tab="students"]');
    const seg=$('#clientSeg',app);
    if(seg) seg.querySelectorAll('.seg-opt').forEach(o=>o.classList.toggle('dz-hot',o===overStuZone));
    if(overStuZone){ trackDwell('stu',x,y,()=>enterStudentTransfer()); }
    else { if(dwell.zone==='stu'){ resetDwell(); } dwell.zone=null; }
    // G3: insertion line within current lead column
    const overCol=elAt(x,y,'.kcol[data-kind="lead"] .kcol-body');
    $$('.ins-line',app).forEach(n=>n.remove());
    if(overCol) paintInsertion(overCol,y);
    // highlight active drop targets
    $$('.kcol',app).forEach(c=>c.classList.remove('drop-ok'));
    const col=elAt(x,y,'.kcol'); if(col)col.classList.add('drop-ok');
  } else {
    // branch / discipline arming inside overlay (with same dwell-debounce on branch → columns)
    armOverlayTargets(x,y);
  }
}
function elAt(x,y,sel){ ghost.style.pointerEvents='none'; const el=document.elementFromPoint(x,y); return el?el.closest(sel):null; }
function paintInsertion(body,y){
  const cards=[...body.querySelectorAll('.card:not(.dragging)')];
  const line=document.createElement('div'); line.className='ins-line';
  let placed=false;
  for(const c of cards){ const r=c.getBoundingClientRect(); if(y<r.top+r.height/2){ body.insertBefore(line,c); placed=true; break; } }
  if(!placed) body.appendChild(line);
}

/* enter the Ученики board mid-drag: show branch drop-zones first (G4/G6/H7) */
function enterStudentTransfer(){
  overStu=true;

  const seg=$('#clientSeg',app); if(seg){ seg.querySelectorAll('.seg-opt').forEach(o=>o.classList.remove('dz-hot')); seg.classList.remove('dz-arm'); }
  $$('.ins-line',app).forEach(n=>n.remove());

function showDiscColumns(branch){

  }).join('')}</div></div>`;

function armOverlayTargets(x,y){
  const app=activeApp(); const ov=$('.stu-overlay',app); if(!ov) return;
  if(ov.dataset.stage==='branch'){
    $$('.bzone',ov).forEach(z=>z.classList.remove('arm'));
    const z=elAt(x,y,'.bzone');
    if(z){ z.classList.add('arm');
      // H7: dwell over a branch (debounced) → auto-reveal that branch's kanban columns
      trackDwell('branch:'+z.dataset.branch,x,y,()=>{ const br=BRANCHES.find(b=>b.id===z.dataset.branch); showDiscColumns(br); dwell.zone=null; });
    } else { if(String(dwell.zone||'').startsWith('branch:')) dwell.zone=null; }
  } else {
    $$('.dzone',ov).forEach(z=>z.classList.remove('arm'));
    const z=elAt(x,y,'.dzone'); if(z) z.classList.add('arm');
  }
}
function endDrag(x,y){
  const app=activeApp();
  if(overStu){
    const ov=$('.stu-overlay',app);
    if(ov.dataset.stage==='branch'){
      const z=elAt(x,y,'.bzone');
      if(z){ const br=BRANCHES.find(b=>b.id===z.dataset.branch); showDiscColumns(br); // reveal columns, keep card "in hand"
        reArmDiscDrag(br); return; }
      else { closeStu(); cleanupDrag(true); }
    } else {
      const z=elAt(x,y,'.dzone');
      const br=BRANCHES.find(b=>b.id===ov.dataset.branch);
      if(z){ const disc=[...DISCIPLINES,{id:'misc',name:'Разноплановые'}].find(d=>d.id===z.dataset.disc);
        closeStu(); cleanupDrag(true,true); doTransfer(dragItem,br,disc); return; }
      else { closeStu(); cleanupDrag(true); }
    }
  } else {
    // in-kanban reorder / status move
    const col=elAt(x,y,'.kcol[data-kind="lead"]');
    if(col){ moveLeadToColumn(dragItem,col.dataset.col,y,col); }
    cleanupDrag(true);
  }
}
/* after dropping on a branch, keep the same card in hand for the disc stage */
function reArmDiscDrag(branch){
  // card is still "held": user keeps pointer down would be ideal; emulate by leaving overlay open + ghost following next move.
  DRAG.active=true; overStu=true; document.documentElement.classList.add('dragging-active'); ghost.classList.add('on');
  const onMove=ev=>{ moveDrag(ev.clientX,ev.clientY); };
  const onUp=ev=>{ window.removeEventListener('pointermove',onMove); endDrag(ev.clientX,ev.clientY); };
  window.addEventListener('pointermove',onMove);
  window.addEventListener('pointerup',onUp,{once:true});
}
function moveLeadToColumn(item,colId,y,colEl){
  const same=item.status===colId;

  LEADS.push(item);

    // J3: dropping into «Отказ» prompts for a причина потери (tracked in Отчёты)

function cleanupDrag(removeArm,transferred){
  DRAG.active=false; overStu = overStu && !removeArm ? overStu : false;
  ghost.classList.remove('on'); ghost.style.transform='translate(-9999px,-9999px) scale(1.03)';

/* K6/K14: OPTIMISTIC transfer — board updates INSTANTLY (no skeleton, no blocking spinner),
   a tiny inline "pending" tag shows briefly, then settles. */
function doTransfer(item,branch,disc){
  LEADS=LEADS.filter(l=>l.id!==item.id);
  const ns={id:'s'+Date.now(),name:item.name,phone:item.phone,branch:branch.id,disc:disc.id,tags:['Новый'],note:'Перенесён из лидов.',pending:true};
  STUDENTS.unshift(ns);
  const wasStudents=ST.clientTab==='students';
  ST.clientTab='students';
  ST.stuBranch=branch.id; // J1: jump to the branch the student landed in
  // apply immediately to the existing board (skip the load skeleton when already on the students layout)
  if(wasStudents){ sizeSeg('#clientSeg','tab',ST.clientTab); renderKanban(); }
  else { render(); } // leads→students changes the layout (adds the Филиал band) — re-render the view shell
  // settle the optimistic record shortly after
  setTimeout(()=>{ ns.pending=false; renderKanban(); },900);
  toast(`${item.name} → Ученики`,`${branch.name} · ${disc.name}`,()=>{
    STUDENTS=STUDENTS.filter(s=>s.id!==ns.id);
    if(!LEADS.find(l=>l.id===item.id)) LEADS.push(item);
    ST.clientTab='leads'; render();
  });
}

let CC_BRANCH='tver';  // which филиал's student funnel is being edited
function ccCols(){ return CC_TARGET==='student'?branchById(CC_BRANCH).cols:ST.kColumns; }
function renderCC(){
  const list=$('#ccList',activeApp()); if(!list) return; list.innerHTML='';
  const head=$('#ccHead',activeApp()); if(head) head.textContent=CC_TARGET==='student'?'Воронка · '+branchById(CC_BRANCH).name:'Воронка лидов';
  const cols=ccCols();
  ccCols().forEach((col,idx)=>{
    const row=document.createElement('div'); row.className='cc-row'; row.dataset.idx=idx;
    row.innerHTML=`<div class="cc-grip">${ic(I.grip,16)}</div><span class="dot" style="background:${col.color}"></span>
      <input value="${col.name}"><button class="cc-del">${ic(I.trash,16)}</button>`;
    row.querySelector('input').oninput=e=>cols[idx].name=e.target.value;
    row.querySelector('.cc-del').onclick=()=>{ cols.splice(idx,1); renderCC(); };
    attachCCDrag(row,list);
    list.appendChild(row);
  });
  // wire «Добавить колонку» on every render so it works from both the board and Настройки
  const add=$('#ccAdd',activeApp());
  if(add) add.onclick=()=>{ ccCols().push({id:'c'+Date.now(),name:'Новая колонка',color:'#A1A1AA'}); renderCC(); };
}
function attachCCDrag(row,list){
  row.querySelector('.cc-grip').addEventListener('pointerdown',e=>{
    e.preventDefault();
    const rows=[...list.children]; const startIdx=rows.indexOf(row); const rowH=row.offsetHeight+8; const startY=e.clientY;
    row.classList.add('cc-drag'); let curIdx=startIdx;
    const move=ev=>{ const dy=ev.clientY-startY; row.style.transform=`translateY(${dy}px)`;
      let ni=Math.max(0,Math.min(rows.length-1,startIdx+Math.round(dy/rowH)));
      if(ni!==curIdx){ curIdx=ni; rows.forEach((r,i)=>{ if(r===row)return; let s=0;
        if(startIdx<ni&&i>startIdx&&i<=ni)s=-rowH; if(startIdx>ni&&i<startIdx&&i>=ni)s=rowH;
        r.style.transition='transform .18s var(--ease)'; r.style.transform=`translateY(${s}px)`; }); } };
    const up=()=>{ window.removeEventListener('pointermove',move); window.removeEventListener('pointerup',up);
      row.classList.remove('cc-drag'); const cols=ccCols(); const m=cols.splice(startIdx,1)[0]; cols.splice(curIdx,0,m);
      rows.forEach(r=>{r.style.transition='';r.style.transform='';}); renderCC(); };
    window.addEventListener('pointermove',move); window.addEventListener('pointerup',up);
  });
}

/* ============================== v7: DUPLICATE / MERGE ============================== */
function openMergeSheet(item,kind){
  const dup=DUPLICATES[item.id]; if(!dup) return;
  const sheet=$('#auxSheet',activeApp());
  // per-field rows: this record (left) vs duplicate (right). pick[field]='a'|'b' (default keep richer/current)
  const fields=[
    {key:'name', label:'Имя',      a:item.name,                 b:dup.name},
    {key:'phone',label:'Телефон',  a:item.phone,                b:dup.phone},
    {key:'src',  label:'Источник', a:item.src||'—',             b:dup.src||'—'},
    {key:'tags', label:'Теги',     a:(item.tags||[]).join(', ')||'—', b:(dup.tags||[]).join(', ')||'—'},
    {key:'note', label:'Заметка',  a:item.note||'—',            b:dup.note||'—'},
  ];
  const pick={}; fields.forEach(f=>pick[f.key]='a'); // default: keep current record
  const colHead=(side,name,tag)=>`<div class="merge-col" data-mcol="${side}"><h6>${tag}</h6>
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
      <div class="ava" style="width:30px;height:30px;font-size:11px;border-radius:9px">${initials(name)}</div>
      <b class="ell" style="font-size:13px">${name}</b></div></div>`;
  const fieldRow=f=>`<div class="merge-field" data-mfield="${f.key}">
      <label>${f.label}</label>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:5px">
        <button class="mf-pick keep" data-mpick="a" data-mfk="${f.key}"><span class="mf-radio"></span><span class="mf-val ell">${f.a}</span></button>
        <button class="mf-pick" data-mpick="b" data-mfk="${f.key}"><span class="mf-radio"></span><span class="mf-val ell">${f.b}</span></button>
      </div></div>`;
  sheet.innerHTML=`<div class="sheet-grab"></div>
    <div class="sheet-head"><div class="icon-badge" style="background:var(--gold-soft);color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold-line)">${ic(I.merge,20)}</div>
      <div style="flex:1"><h3>Сравнить и объединить</h3><p>Выберите, какое значение оставить в каждом поле</p></div>
      <button class="btn btn-ghost icon-btn" data-close="aux">${ic(I.close,20)}</button></div>
    <div class="sheet-body">
      <div class="merge-grid">${colHead('a',item.name,'Эта запись')}${colHead('b',dup.name,'Дубль · '+dup.when)}</div>
      <div style="margin-top:6px">${fields.map(fieldRow).join('')}</div>
      <div class="note" style="margin-top:4px">После объединения дубль будет удалён, выбранные значения попадут в основную запись.</div>
    </div>
    <div class="sheet-foot"><button class="btn" style="flex:1" data-close="aux">Отмена</button>
      <button class="btn btn-primary" style="flex:1" id="mergeGo">${ic(I.merge,17)}Объединить</button></div>`;
  sheet.querySelectorAll('[data-close="aux"]').forEach(b=>b.onclick=()=>closeSheet('aux'));
  // per-field choose-which-to-keep
  sheet.querySelectorAll('[data-mpick]').forEach(btn=>btn.onclick=()=>{
    const fk=btn.dataset.mfk; pick[fk]=btn.dataset.mpick;
    sheet.querySelectorAll(`[data-mfk="${fk}"]`).forEach(b=>b.classList.toggle('keep',b===btn));
  });
  sheet.querySelector('#mergeGo').onclick=()=>{
    const before={name:item.name,phone:item.phone,src:item.src,tags:item.tags,note:item.note};
    // apply chosen values onto the current record
    if(pick.name==='b') item.name=dup.name;
    if(pick.phone==='b') item.phone=dup.phone;
    if(pick.src==='b') item.src=dup.src;
    if(pick.tags==='b') item.tags=(dup.tags||[]).slice();
    if(pick.note==='b') item.note=dup.note;
    delete DUPLICATES[item.id];
    closeSheet('aux'); closeDrawer('card');
    if(curNav()==='clients') renderKanban();
    toast('Записи объединены',`${item.name} · дубль удалён`,()=>{
      // Undo: restore original record + duplicate
      item.name=before.name; item.phone=before.phone; item.src=before.src; item.tags=before.tags; item.note=before.note;
      DUPLICATES[item.id]=dup;
      if(curNav()==='clients') renderKanban();
      toast('Отменено','Дубль восстановлен');
    });
  };
  openSheet('aux');
}

/* K11: month calendar — each day cell shows a quick lesson-count overview; tap drills into the day grid */
const MONTHS=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
function monthLabel(){ return MONTHS[ST.schMonth]+' '+ST.schYear; }
function monthMeta(){ const first=new Date(ST.schYear,ST.schMonth,1).getDay(); // 0=Sun..6=Sat → Monday-based
  return { firstW:(first+6)%7, days:new Date(ST.schYear,ST.schMonth+1,0).getDate() }; }
function isDemoMonth(){ return ST.schMonth===7 && ST.schYear===2026; }
function shiftMonth(delta){ let m=ST.schMonth+delta,y=ST.schYear; if(m<0){m=11;y--;} if(m>11){m=0;y++;} ST.schMonth=m; ST.schYear=y; }
function renderMonth(){

  // demo per-day lesson counts — only for the Aug-2026 demo month
  const cnt=d=>{ if(!demo) return 0; const seed=(d*7)%13; return d>=17&&d<=23 ? [12,9,14,11,8,5,3][d-17] : (seed%5===0?0:(seed%6)+1); };
  let cells='';
  for(let i=0;i<firstW;i++) cells+=`<div class="mcell muted"></div>`;

      <div class="md-num">${d}</div>

  $$('.mcell[data-mday]',wrap).forEach(c=>c.onclick=()=>{ const d=+c.dataset.mday; if(isDemoMonth()) ST.activeDay=Math.max(17,Math.min(23,d)); ST.schMode='day'; render(); });

function curCols(){ return ST.schView==='rooms'?ROOMS.filter(r=>r.branch===ST.schBranch):TEACHERS; }
function colKeyOf(l){ return ST.schView==='rooms'?l.room:l.teacher; }
function renderGrid(){
  const wrap=$('#gridWrap',activeApp()); if(!wrap) return; wrap.innerHTML='';
  const sub=$('#schSub',activeApp()); if(sub) sub.textContent=`Студия на Тверской · ${LESSONS.length} занятий`;

  const grid=document.createElement('div'); grid.className='cal-grid';
  grid.style.gridTemplateColumns=`56px repeat(${cols.length}, minmax(210px,1fr))`;

  cols.forEach(c=>{ const h=document.createElement('div'); h.className='col-head';
    const cic=ST.schView==='rooms'?I.room:'<circle cx="12" cy="8" r="4"/><path d="M4 20a8 8 0 0 1 16 0"/>';
    h.innerHTML=`<div class="ch-ic">${ic(cic,15)}</div><div style="min-width:0"><b>${c.name}</b><small>${c.sub}</small></div>`; grid.appendChild(h); });
  for(let r=0;r<nB;r++){
    const tc=document.createElement('div'); tc.className='time-cell tnum'; tc.textContent=String(HOURS[r]).padStart(2,'0')+':00'; grid.appendChild(tc);
    cols.forEach(c=>{ const cell=document.createElement('div'); cell.className='cell'; cell.dataset.col=c.id; cell.dataset.row=r; grid.appendChild(cell); });
  }
  cal.appendChild(grid);
  const layer=document.createElement('div'); layer.className='lessons-layer'; cal.appendChild(layer);
  wrap.appendChild(cal);
  requestAnimationFrame(()=>placeLessons(grid,layer,cols,nB));
  attachBlockSelect(grid,cols,nB);

function placeLessons(grid,layer,cols,nB){
  const gridRect=grid.getBoundingClientRect();
  cols.forEach(col=>{
    const sample=grid.querySelector(`.cell[data-col="${col.id}"][data-row="0"]`); if(!sample) return;
    const sRect=sample.getBoundingClientRect(); const left=sRect.left-gridRect.left, width=sRect.width;
    LESSONS.filter(l=>colKeyOf(l)===col.id).forEach(l=>{
      const rowStart=l.startH-HOURS[0]; if(rowStart<0||rowStart>=nB) return;
      const top=44+rowStart*ROW_H; const rem=l.durMin%60; const height=(l.durMin/60)*ROW_H;
      // adaptive card by duration so short lessons don't chew the text:
      // <1h → one row (student + start); 1–1.5h → time+student (teacher hidden via CSS); ≥1.5h → all 3.
      const size = l.durMin<60 ? 'tiny' : (l.durMin<90 ? 'compact' : 'full');
      const el=document.createElement('div'); el.className='lesson '+size+(rem?' partial':'');
      el.style.left=(left+4)+'px'; el.style.top=(top+3)+'px'; el.style.width=(width-8)+'px'; el.style.height=(height-6)+'px';
      const tea=TEACHERS.find(t=>t.id===l.teacher); const endMin=l.startH*60+l.durMin; const eh=Math.floor(endMin/60),em=endMin%60;
      const dl=`${Math.floor(l.durMin/60)}:${String(l.durMin%60).padStart(2,'0')}`;
      if(rem) el.style.setProperty('--cut',(100-(rem/60)*100)+'%');
      const startLbl=String(l.startH).padStart(2,'0')+':00';
      el.innerHTML = size==='tiny'
        ? `<div class="ls-stu">${l.student}</div><div class="ls-mini tnum">${startLbl}</div>`
        : `<div class="ls-time">${startLbl}–${String(eh).padStart(2,'0')}:${String(em).padStart(2,'0')} · ${dl}</div>
           <div class="ls-stu">${l.student}</div><div class="ls-tea">${tea?tea.name:'—'}${l.disc?' · '+l.disc:''}</div>`;
      el.onclick=()=>openLesson(l);
      layer.appendChild(el);
    });
  });
}
function attachBlockSelect(grid,cols,nB){
  // K5: teacher cannot create/assign lessons → no block-drag booking, no tap-to-book
  if(ST.role==='teacher') return;
  let selecting=false,colId=null,startRow=0,curRow=0;
  const clearSel=()=>grid.querySelectorAll('.cell.selecting,.cell.sel').forEach(c=>c.classList.remove('selecting','sel'));
  const paint=()=>{ clearSel(); const a=Math.min(startRow,curRow),b=Math.max(startRow,curRow);
    for(let r=a;r<=b;r++){ const c=grid.querySelector(`.cell[data-col="${colId}"][data-row="${r}"]`); if(c)c.classList.add('selecting'); } };
  grid.addEventListener('pointerdown',e=>{
    const cell=e.target.closest('.cell'); if(!cell) return; e.preventDefault();
    selecting=true; colId=cell.dataset.col; startRow=+cell.dataset.row; curRow=startRow;
    document.documentElement.classList.add('vselecting'); paint();
    const move=ev=>{ if(!selecting)return; const sample=grid.querySelector(`.cell[data-col="${colId}"][data-row="0"]`);
      const r0=sample.getBoundingClientRect(); let row=Math.floor((ev.clientY-r0.top)/ROW_H); row=Math.max(0,Math.min(nB-1,row));
      if(row!==curRow){ curRow=row; paint(); } };
    const up=()=>{ window.removeEventListener('pointermove',move); window.removeEventListener('pointerup',up);
      document.documentElement.classList.remove('vselecting'); selecting=false;
      const a=Math.min(startRow,curRow),b=Math.max(startRow,curRow);
      grid.querySelectorAll('.cell.selecting').forEach(c=>{c.classList.remove('selecting');c.classList.add('sel');});
      openBooking(a,b-a+1,colId,cols);
    };
    window.addEventListener('pointermove',move); window.addEventListener('pointerup',up);
  });
}

/* H6: find lessons that overlap a [startMin,endMin) span for the booking column (room or teacher) */
function findConflicts(startMin,endMin,colId){
  return LESSONS.filter(l=>{
    if(colKeyOf(l)!==colId) return false;
    const ls=l.startH*60, le=ls+l.durMin;
    return ls<endMin && le>startMin; // overlap
  });
}
function hhmm(min){return String(Math.floor(min/60)).padStart(2,'0')+':'+String(min%60).padStart(2,'0');}
function conflictHTML(list,colLabel){
  const rows=list.map(l=>{
    const ls=l.startH*60, le=ls+l.durMin;
    return `<div class="cf-occ"><span class="dot"></span><span>${hhmm(ls)}–${hhmm(le)} · ${l.student||l.disc||'Занятие'}</span></div>`;
  }).join('');
  return `<div class="conflict" id="bookConflict">
    <div class="cf-ic">${ic(I.warn,18)}</div>
    <div class="cf-tx"><b>⚠ ${colLabel} занят${list.length>1?'о':''} в это время</b>
      <p>Выбранный диапазон пересекается с ${list.length} ${plural(list.length,'занятием','занятиями','занятиями')}. Проверьте время или создайте поверх.</p>
      <div class="cf-list">${rows}</div></div></div>`;
}

  // H6: recompute conflict whenever duration / room / teacher changes

    const startMin=BOOK.startH*60, endMin=startMin+BOOK.durMin;
    const teaName=sheet.querySelector('#bookTeacher').value, roomName=sheet.querySelector('#bookRoom').value;
    const room=ROOMS.find(r=>r.name===roomName), tea=TEACHERS.find(t=>t.name===teaName);

    const colLabel = ST.schView==='rooms' ? (room?room.name:'Зал') : (tea?tea.name:'Преподаватель');
    const list=findConflicts(startMin,endMin,colId);
    const slot=sheet.querySelector('#conflictSlot'); const btn=sheet.querySelector('#bookConfirm');
    if(list.length){
      slot.innerHTML=conflictHTML(list,colLabel);
      btn.className='btn danger'; btn.style.flex='1'; btn.innerHTML=`${ic(I.warn,17)}Всё равно создать`;
    } else { slot.innerHTML=''; btn.className='btn btn-primary'; btn.style.flex='1'; btn.innerHTML=`${ic(I.check,17)}Создать занятие`; }

    sheet.querySelectorAll('.dur-pad .chip').forEach(c=>c.classList.toggle('on',+c.dataset.dur===m)); refreshConflict(); };

/* ============================== POPMENU / DRAWER / SHEET / TOAST ============================== */
function openPop(anchor,items,center){
  const pop=$('[data-popmenu]',activeApp());
  pop.innerHTML=items.map(it=>{
    if(it.sep) return '<div class="pm-sep"></div>';
    if(it.sub) return `<div class="pm-sub">${it.sub}</div>`;
    return `<button class="pm-item${it.danger?' danger':''}">${ic(it.icon,17)}<span>${it.label}</span></button>`;
  }).join('');
  const btns=[...pop.querySelectorAll('.pm-item')]; let bi=0;
  items.forEach(it=>{ if(it.sep||it.sub)return; const b=btns[bi++]; b.onclick=()=>{ closePop(); it.act&&it.act(); }; });
  pop.classList.add('show');
  const host=activeApp().getBoundingClientRect();
  if(center||!anchor){ pop.style.left=(host.width/2-105)+'px'; pop.style.top=(host.height/2-80)+'px'; pop.style.transformOrigin='center'; }
  else { const r=anchor.getBoundingClientRect();
    let left=r.right-host.left-210; if(left<8)left=8;
    let top=r.bottom-host.top+6; const ph=items.length*40+16;
    if(top+ph>host.height-8) top=r.top-host.top-ph-6;
    pop.style.left=left+'px'; pop.style.top=Math.max(8,top)+'px'; pop.style.transformOrigin='top right'; }
  setTimeout(()=>document.addEventListener('pointerdown',outsidePop,{once:true}),0);
}
function outsidePop(e){ const pop=$('[data-popmenu]',activeApp()); if(pop&&!pop.contains(e.target))closePop(); else if(pop&&pop.classList.contains('show'))setTimeout(()=>document.addEventListener('pointerdown',outsidePop,{once:true}),0); }
function closePop(){ const pop=$('[data-popmenu]',activeApp()); if(pop)pop.classList.remove('show'); }

}
function openDrawer(k){ const app=activeApp(); $(`[data-drawer="${k}"]`,app)?.classList.add('show'); $(`[data-scrim="${k}"]`,app)?.classList.add('show'); }
function closeDrawer(k){ const app=activeApp(); $(`[data-drawer="${k}"]`,app)?.classList.remove('show'); $(`[data-scrim="${k}"]`,app)?.classList.remove('show'); }
function openSheet(k){ const app=activeApp(); $(`[data-sheet="${k}"]`,app)?.classList.add('show'); $(`[data-scrim="${k}"]`,app)?.classList.add('show'); }
function closeSheet(k){ const app=activeApp(); $(`[data-sheet="${k}"]`,app)?.classList.remove('show'); $(`[data-scrim="${k}"]`,app)?.classList.remove('show'); }
function toast(title,sub,undo){
  const wrap=$('[data-toasts]',activeApp()); if(!wrap)return;
  const t=document.createElement('div'); t.className='toast';
  t.innerHTML=`<div class="t-ic">${ic(I.check,17)}</div><div class="t-txt"><b>${title}</b><small>${sub||''}</small></div>${undo?'<button class="t-undo">Отменить</button>':''}`;
  wrap.appendChild(t); requestAnimationFrame(()=>t.classList.add('show'));
  const to=setTimeout(dismiss,4200);
  function dismiss(){ t.classList.remove('show'); setTimeout(()=>t.remove(),320); }
  if(undo) t.querySelector('.t-undo').onclick=()=>{ undo(); clearTimeout(to); dismiss(); };
}
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ ['filters','cols','card','cf'].forEach(closeDrawer); ['book','lesson','convert','info','aux'].forEach(closeSheet); closeStudentScreen(); closePop(); } });

/* ============================== BOOT ============================== */
function boot(){
  document.documentElement.dataset.frame=ST.frame;
  document.documentElement.dataset.role=ST.role;
  render();
  // re-place glides once fonts settle
  setTimeout(()=>{ syncToggles(); if(curNav()==='clients')sizeSeg('#clientSeg','tab',ST.clientTab); if(curNav()==='schedule'){ sizeSeg('#schSeg','sview',ST.schView); sizeSeg('#schSegPhone','sview',ST.schView);} },140);
}
boot();
window.addEventListener('resize',()=>{ syncToggles(); const n=curNav(); if(n==='clients')sizeSeg('#clientSeg','tab',ST.clientTab); if(n==='schedule'){ renderGrid(); sizeSeg('#schSeg','sview',ST.schView); sizeSeg('#schSegPhone','sview',ST.schView);} });
</script>
