<!DOCTYPE html>
<html lang="ru" data-frame="phone" data-role="manager">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>MagicMusicCRM — Redesign v7</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
/* ============================== TOKENS (LOCKED, from v1) ============================== */
:root{
  --bg:#101012; --surface:#1A1A1D; --sidebar:#151518; --input:#242427;
  --divider:#2A2A2D; --text:#FFFFFF; --text-2:#A1A1AA;
  --gold:#C5A059; --gold-2:#BFA37E; --success:#10B981; --danger:#E53935;
  --gold-soft:rgba(197,160,89,.14); --gold-line:rgba(197,160,89,.34);
  --r-card:14px; --r-ctrl:10px;
  --sh-1:0 1px 2px rgba(0,0,0,.4);
  --sh-2:0 8px 24px rgba(0,0,0,.45);
  --sh-lift:0 18px 44px rgba(0,0,0,.55), 0 0 0 1px var(--gold-line);
  --ease:cubic-bezier(0.22,1,0.36,1);
  --z-nav:20; --z-appbar:25; --z-drawer-back:60; --z-drawer:70; --z-sheet-back:80; --z-sheet:90; --z-drag:120; --z-toast:130; --z-tooltip:140;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:
    radial-gradient(1200px 700px at 20% -8%, rgba(197,160,89,.07), transparent 60%),
    radial-gradient(1000px 800px at 108% 110%, rgba(122,162,247,.05), transparent 55%),
    #0a0a0c;
  color:var(--text);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased;
  font-feature-settings:"cv05","ss01"; overflow:hidden;
}
.tnum{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
/* H3: global overflow hardening — nothing bleeds past its container */
.ell{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app,.app *{max-width:100%}
.kv span,.note{overflow-wrap:anywhere;word-break:break-word}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit}
svg{display:block;flex:none}
::selection{background:var(--gold-soft);color:#fff}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
/* ===== J3/I2: HIDE all scrollbars app-wide (app-native — content scrolls, bar invisible) ===== */
*{scrollbar-width:none;-ms-overflow-style:none}
*::-webkit-scrollbar{display:none;width:0;height:0}

/* ============================== STAGE / TOP CONTROLS ============================== */
.stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;overflow:hidden}
.controls{flex:none;display:flex;align-items:center;gap:14px;padding:16px 22px;width:100%;justify-content:center;flex-wrap:wrap;z-index:var(--z-nav)}
.controls .logo{display:flex;align-items:center;gap:10px;margin-right:auto}
.controls .logo .lm{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;
  background:linear-gradient(150deg,#2a2418,#1d1a12);box-shadow:inset 0 0 0 1px var(--gold-line)}
.controls .logo .lm svg{color:var(--gold)}
.controls .logo b{font-size:14px;font-weight:700;letter-spacing:-.01em}
.controls .logo b span{color:var(--gold)}
.controls .logo small{display:block;font-size:10.5px;color:var(--text-2);font-weight:600;margin-top:-1px}
.controls .meta{margin-left:auto;font-size:11.5px;color:#56565e;font-weight:500;letter-spacing:.01em}

/* generic segmented (frame switch + role) */
.tog{display:inline-flex;background:var(--input);border:1px solid var(--divider);border-radius:11px;padding:4px;position:relative;height:42px}
.tog .glide{position:absolute;top:4px;bottom:4px;border-radius:8px;background:var(--surface);
  box-shadow:var(--sh-1),inset 0 0 0 1px var(--gold-line);transition:transform .26s var(--ease),width .26s var(--ease);z-index:0}
.tog.gold .glide{background:var(--gold);box-shadow:0 2px 12px rgba(197,160,89,.4)}
.tog button{position:relative;z-index:1;display:flex;align-items:center;gap:8px;height:34px;padding:0 15px;border-radius:8px;
  font-size:13px;font-weight:600;color:var(--text-2);white-space:nowrap;transition:color .2s var(--ease)}
.tog button svg{width:16px;height:16px}
.tog button.on{color:#fff}
.tog button.on svg{color:var(--gold)}
.tog.gold button.on{color:#1a1408}
.tog.gold button.on svg{color:#1a1408}
.ctrl-label{font-size:11px;color:#56565e;font-weight:700;text-transform:uppercase;letter-spacing:.08em}

/* ============================== DEVICE FRAMES ============================== */
.stage-body{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;padding:0 22px 26px}

/* PHONE */
.phone{
  width:390px;height:844px;max-height:calc(100vh - 110px);border-radius:46px;flex:none;
  background:#000;padding:11px;box-shadow:0 0 0 2px #232327, 0 30px 80px rgba(0,0,0,.7), 0 0 0 9px #0d0d0f;
  position:relative;
}
.phone .screen{width:100%;height:100%;border-radius:36px;overflow:hidden;background:var(--bg);position:relative;display:flex;flex-direction:column}
.phone .notch{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:124px;height:30px;background:#000;border-radius:0 0 18px 18px;z-index:50}
.statusbar{flex:none;height:46px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 26px 7px;font-size:13px;font-weight:600;color:#fff;z-index:30}
.statusbar .sb-r{display:flex;align-items:center;gap:6px}
.home-ind{flex:none;height:22px;display:grid;place-items:end center;padding-bottom:8px}
.home-ind i{width:134px;height:5px;border-radius:99px;background:#5a5a60;display:block}

/* DESKTOP */
.desktop{
  width:1440px;height:900px;max-width:calc(100vw - 44px);max-height:calc(100vh - 110px);border-radius:14px;flex:none;
  background:var(--bg);overflow:hidden;display:flex;
  box-shadow:0 0 0 1px #232327, 0 30px 90px rgba(0,0,0,.7);position:relative;
}
.dtitlebar{position:absolute;top:0;left:0;right:0;height:0;display:none}

/* show the right frame */
html[data-frame="phone"] .desktop{display:none}
html[data-frame="desktop"] .phone{display:none}

/* ============================== SHARED APP PRIMITIVES ============================== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 15px;border-radius:var(--r-ctrl);
  font-weight:600;font-size:13px;background:var(--input);color:var(--text);border:1px solid var(--divider);
  transition:background .16s var(--ease),border-color .16s var(--ease),transform .1s var(--ease)}
.btn svg{width:17px;height:17px}
.btn:hover{background:#2c2c30;border-color:#34343a}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--gold);color:#1a1408;border-color:transparent}
.btn-primary:hover{background:#d0ad66}
.btn-ghost{background:transparent;border-color:transparent;color:var(--text-2)}
.btn-ghost:hover{background:#1e1e22;color:#fff}
.btn[disabled]{opacity:.42;cursor:not-allowed}
.icon-btn{width:40px;height:40px;justify-content:center;padding:0}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:7px;font-size:11.5px;font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.ava{border-radius:50%;display:grid;place-items:center;font-weight:600;background:#2a2a2f;color:var(--gold-2);position:relative;flex:none}
.ava .odot{position:absolute;right:-1px;bottom:-1px;width:11px;height:11px;border-radius:50%;background:var(--success);border:2px solid var(--surface)}

.search{display:flex;align-items:center;gap:9px;height:40px;padding:0 13px;border-radius:var(--r-ctrl);
  background:var(--input);border:1px solid var(--divider);min-width:0;flex:1;
  transition:border-color .16s var(--ease),box-shadow .16s var(--ease)}
.search svg{width:17px;height:17px;color:var(--text-2);flex:none}
.search:focus-within{border-color:var(--gold-line);box-shadow:0 0 0 3px var(--gold-soft)}
.search input{background:none;border:none;outline:none;color:#fff;font-size:13.5px;width:100%}
.search input::placeholder{color:#6e6e76}

.seg{display:inline-flex;background:var(--input);border:1px solid var(--divider);border-radius:11px;padding:4px;position:relative;height:42px}
.seg .seg-glide{position:absolute;top:4px;bottom:4px;border-radius:8px;background:var(--surface);
  box-shadow:var(--sh-1),inset 0 0 0 1px var(--gold-line);transition:transform .26s var(--ease),width .26s var(--ease);z-index:0}
.seg-opt{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:8px;height:34px;padding:0 16px;border-radius:8px;
  font-size:13.5px;font-weight:600;color:var(--text-2);white-space:nowrap;transition:color .2s var(--ease)}
.seg-opt svg{width:16px;height:16px}
.seg-opt.on{color:#fff}
.seg-opt.on svg{color:var(--gold)}
.seg-opt .cnt{font-size:11px;color:var(--text-2);font-variant-numeric:tabular-nums}
.seg-opt.on .cnt{color:var(--gold)}

.field{display:flex;flex-direction:column;gap:8px}
.field>label{font-size:12px;font-weight:600;color:var(--text-2)}
.chip-row{display:flex;flex-wrap:wrap;gap:7px}
.chip{height:34px;padding:0 13px;border-radius:9px;background:var(--input);border:1px solid var(--divider);
  font-size:12.5px;font-weight:600;color:var(--text-2);display:inline-flex;align-items:center;gap:6px;transition:all .15s var(--ease)}
.chip:hover{border-color:#3a3a41;color:#fff}
.chip.on{background:var(--gold-soft);border-color:var(--gold-line);color:var(--gold)}
.sel,.inp{height:42px;padding:0 13px;border-radius:var(--r-ctrl);background:var(--input);border:1px solid var(--divider);
  color:#fff;font-size:13.5px;width:100%;outline:none;transition:border-color .15s var(--ease),box-shadow .15s var(--ease)}
.sel:focus,.inp:focus{border-color:var(--gold-line);box-shadow:0 0 0 3px var(--gold-soft)}

/* ============================== APP-BAR (phone) + RAIL (desktop) ============================== */
.appbar{flex:none;height:54px;display:flex;align-items:center;gap:10px;padding:0 8px 0 6px;border-bottom:1px solid var(--divider);
  background:rgba(21,21,24,.86);backdrop-filter:blur(10px);position:relative;z-index:var(--z-appbar)}
.appbar .ab-back{width:42px;height:42px;border-radius:11px;display:none;align-items:center;justify-content:center;color:var(--text-2)}
.appbar .ab-back:hover{background:#1e1e22;color:#fff}
.appbar .ab-title{min-width:0;flex:1;padding-left:6px}
.appbar .ab-title b{font-size:16px;font-weight:700;letter-spacing:-.01em;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appbar .ab-title small{font-size:11.5px;color:var(--text-2);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appbar .ab-act{display:flex;align-items:center;gap:2px}
.appbar .ab-ic{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;color:var(--text-2)}
.appbar .ab-ic:hover{background:#1e1e22;color:#fff}

/* desktop rail */
.rail{width:76px;flex:none;background:var(--sidebar);border-right:1px solid var(--divider);display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:6px}
.rail .rail-brand{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;margin-bottom:8px;
  background:linear-gradient(150deg,#2a2418,#1d1a12);box-shadow:inset 0 0 0 1px var(--gold-line)}
.rail .rail-brand svg{color:var(--gold)}
.rail-item{width:56px;height:54px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  color:var(--text-2);position:relative;transition:background .16s var(--ease),color .16s var(--ease)}
.rail-item svg{width:21px;height:21px}
/* K13: rail labels fit the rail width without clipping — long labels (Пользователи) shrink to fit */
.rail-item{width:68px}
.rail-item span{font-size:9.5px;font-weight:600;letter-spacing:-.01em;max-width:100%;text-align:center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.1}
.rail-item.long span{font-size:8px;letter-spacing:-.03em}
.rail-item:hover{background:#1e1e22;color:#fff}
.rail-item.active{background:var(--gold-soft);color:#fff}
.rail-item.active svg{color:var(--gold)}
.rail-item .rb{position:absolute;top:7px;right:9px;min-width:17px;height:17px;border-radius:6px;background:var(--gold);color:#1a1408;
  font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px;box-shadow:0 0 0 2px var(--sidebar)}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:8px}
.rail-foot .ava{width:40px;height:40px;font-size:14px;cursor:pointer}

/* bottom tab bar (phone) */
.tabbar{flex:none;height:62px;display:flex;align-items:stretch;border-top:1px solid var(--divider);background:rgba(21,21,24,.92);
  backdrop-filter:blur(12px);padding-bottom:env(safe-area-inset-bottom)}
.tab{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--text-2);position:relative;
  transition:color .16s var(--ease);padding:0 2px}
.tab svg{width:23px;height:23px;transition:transform .2s var(--ease)}
/* J3/I7: tab labels never overflow — truncate, and tighten when the role has many tabs (Управляющий = 7) */
.tab span{font-size:10px;font-weight:600;letter-spacing:.005em;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabbar.many .tab span{font-size:8.5px;letter-spacing:-.01em}
.tabbar.many .tab svg{width:21px;height:21px}
.tab.active{color:var(--gold)}
.tab.active svg{transform:translateY(-1px)}
.tab .tb-badge{position:absolute;top:6px;left:calc(50% + 7px);min-width:17px;height:17px;border-radius:6px;background:var(--gold);color:#1a1408;
  font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}

/* ============================== APP SHELL ============================== */
.app{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;position:relative}
/* desktop: rail + content */
.desk-shell{flex:1;min-height:0;display:flex;overflow:hidden}
.desk-content{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden;position:relative}

.view{flex:1;min-height:0;display:none;flex-direction:column;overflow:hidden}
.view.show{display:flex}
.scroll{overflow:auto;min-height:0}

/* generic frame-scoped header band */
.head-band{flex:none;display:flex;align-items:center;gap:12px;padding:13px 16px 11px}
.tools-band{flex:none;display:flex;align-items:center;gap:10px;padding:0 16px 12px;flex-wrap:wrap}
.hint-bar{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--text-2);padding:0 16px 9px;flex:none}
.hint-bar svg{width:14px;height:14px;color:var(--gold-2)}
.hint-bar b{color:#d4d4d8}
/* J1: on-screen Филиал selector for the Ученики board */
.branch-band{flex:none;display:flex;align-items:center;gap:9px;padding:0 16px 11px;min-width:0}
.branch-band>svg{width:15px;height:15px;color:var(--gold-2);flex:none}
.branch-band .chip-row{min-width:0}
html[data-frame="desktop"] .branch-band{padding:0 22px 13px}
/* J2: phone-only labeled Комнаты|Преподаватели segmented control on the schedule day view */
.schseg-band{flex:none;display:flex;align-items:center;gap:10px;padding:0 16px 12px}
.schseg-band .ctrl-label{color:var(--text-2);font-weight:600;flex:none}
/* Год/Месяц/День — own row; full-width on phone, inline on desktop */
.mode-band{flex:none;display:flex;padding:0 16px 10px}
html[data-frame="desktop"] .mode-band{padding:0 22px 12px}
html[data-frame="phone"] .mode-band>.seg{width:100%}
html[data-frame="phone"] .mode-band .seg-opt{flex:1;padding:0!important}
html[data-frame="desktop"] [data-phoneonly]{display:none !important}

/* ============================== CHAT ============================== */
.chat-shell{flex:1;min-height:0;display:flex;overflow:hidden}
.chat-list{flex:none;display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--divider);background:var(--bg)}
.chat-list .cl-head{flex:none;padding:12px 14px 10px;display:flex;flex-direction:column;gap:10px}
.cl-title{display:flex;align-items:center;gap:10px}
.cl-title b{font-size:18px;font-weight:700;letter-spacing:-.015em}
.cl-scroll{flex:1;min-height:0;overflow:auto}
.cl-item{display:flex;align-items:center;gap:12px;padding:10px 14px;cursor:pointer;position:relative;transition:background .14s var(--ease)}
.cl-item:hover{background:#161618}
.cl-item.on{background:var(--gold-soft)}
.cl-item .ava{width:50px;height:50px;font-size:16px}
.cl-mid{flex:1;min-width:0}
.cl-row1{display:flex;align-items:center;gap:8px}
.cl-name{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.cl-time{font-size:11.5px;color:var(--text-2);flex:none}
.cl-row2{display:flex;align-items:center;gap:8px;margin-top:2px}
.cl-prev{font-size:13px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.cl-prev .me{color:#6e6e76}
.cl-unread{min-width:20px;height:20px;border-radius:11px;background:var(--gold);color:#1a1408;font-size:11px;font-weight:700;
  display:grid;place-items:center;padding:0 6px;flex:none}
.cl-muted .cl-unread{background:#3a3a40;color:#cfcfd4}
.cl-tick{color:var(--gold-2);flex:none}

/* conversation */
.conv{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0;background:
  linear-gradient(180deg,rgba(16,16,18,.4),rgba(16,16,18,.4)),
  radial-gradient(circle at 18% 12%, rgba(197,160,89,.05), transparent 24%),
  radial-gradient(circle at 82% 78%, rgba(122,162,247,.04), transparent 24%), var(--bg)}
.conv-head{flex:none;height:60px;display:flex;align-items:center;gap:11px;padding:0 8px 0 12px;border-bottom:1px solid var(--divider);
  background:rgba(21,21,24,.82);backdrop-filter:blur(10px)}
.conv-head .ava{width:40px;height:40px;font-size:14px}
.conv-head .ch-meta{min-width:0;flex:1}
.conv-head .ch-meta b{font-size:14.5px;font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv-head .ch-meta small{font-size:11.5px;color:var(--success);display:block}
.conv-head .ch-meta small.off{color:var(--text-2)}
.conv-scroll{flex:1;min-height:0;overflow:auto;padding:14px 16px 8px;display:flex;flex-direction:column;gap:3px}
.date-sep{align-self:center;margin:10px 0 8px;font-size:11px;font-weight:600;color:#bfbfc6;background:rgba(40,40,46,.7);
  border-radius:99px;padding:4px 12px;backdrop-filter:blur(4px)}
.bubble{max-width:74%;padding:7px 11px 6px;border-radius:15px;font-size:14px;line-height:1.4;position:relative;word-wrap:break-word}
.bubble .b-meta{display:inline-flex;align-items:center;gap:3px;float:right;margin:6px 0 -2px 9px;font-size:10.5px;font-variant-numeric:tabular-nums}
.bubble.in{align-self:flex-start;background:#212126;border-bottom-left-radius:5px;color:#f0f0f2}
.bubble.in .b-meta{color:#6e6e76}
.bubble.out{align-self:flex-end;background:var(--gold);color:#221a09;border-bottom-right-radius:5px}
.bubble.out .b-meta{color:rgba(34,26,9,.6)}
.bubble.out .b-meta svg{color:#221a09}
.bubble.consec-in{border-top-left-radius:6px}
.bubble.consec-out{border-top-right-radius:6px}
.b-voice{display:flex;align-items:center;gap:10px;min-width:172px;padding:2px 0}
.b-voice .vp{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none;background:rgba(34,26,9,.18)}
.bubble.in .b-voice .vp{background:rgba(197,160,89,.18);color:var(--gold)}
.b-wave{flex:1;display:flex;align-items:center;gap:2px;height:22px}
.b-wave i{flex:1;border-radius:2px;background:currentColor;opacity:.5}
.b-vtime{font-size:11px;font-weight:600;opacity:.8}
/* composer */
.composer{flex:none;display:flex;align-items:flex-end;gap:8px;padding:8px 10px;border-top:1px solid var(--divider);
  background:rgba(21,21,24,.82);backdrop-filter:blur(10px)}
.composer .c-ic{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;color:var(--text-2);flex:none}
.composer .c-ic:hover{background:#1e1e22;color:#fff}
.composer .c-field{flex:1;display:flex;align-items:center;gap:8px;background:var(--input);border:1px solid var(--divider);
  border-radius:20px;padding:0 6px 0 14px;min-height:42px;transition:border-color .15s var(--ease)}
.composer .c-field:focus-within{border-color:var(--gold-line)}
.composer .c-field input{flex:1;background:none;border:none;outline:none;color:#fff;font-size:14px;padding:10px 0}
.composer .c-field input::placeholder{color:#6e6e76}
.composer .c-send{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none;
  background:var(--gold);color:#1a1408;transition:transform .14s var(--ease)}
.composer .c-send:hover{transform:scale(1.06)}

/* ============================== CLIENTS / KANBAN ============================== */
.kanban-wrap{flex:1;min-height:0;overflow:auto;padding:2px 16px 18px}
.kanban{display:flex;gap:12px;align-items:flex-start;min-height:100%;width:max-content;padding-bottom:6px}
.kcol{width:248px;flex:none;background:var(--surface);border:1px solid var(--divider);border-radius:var(--r-card);
  display:flex;flex-direction:column;max-height:100%;transition:box-shadow .2s var(--ease),border-color .2s var(--ease),transform .2s var(--ease)}
.kcol-head{display:flex;align-items:center;gap:9px;padding:12px 12px 9px}
.kcol-head .dot{width:9px;height:9px}
.kcol-title{font-weight:600;font-size:13.5px}
.kcol-count{margin-left:auto;font-size:12px;color:var(--text-2);font-variant-numeric:tabular-nums;background:#232327;border-radius:6px;padding:1px 8px}
.kcol-body{display:flex;flex-direction:column;gap:9px;padding:2px 10px 12px;overflow-y:auto;min-height:54px;position:relative}
.kcol.drop-ok{border-color:var(--gold-line);box-shadow:0 0 0 1px var(--gold-line),inset 0 0 30px var(--gold-soft)}
/* G5: drop target grows + dashed contour */
.kcol.drop-arm{border:1.5px dashed var(--gold);transform:scale(1.015);box-shadow:0 0 0 4px var(--gold-soft)}

.card{background:#202024;border:1px solid #2c2c31;border-radius:12px;padding:11px 12px;cursor:pointer;
  transition:transform .14s var(--ease),box-shadow .14s var(--ease),border-color .14s var(--ease),opacity .2s var(--ease);
  user-select:none;-webkit-user-select:none;touch-action:pan-y;position:relative}
.card:hover{border-color:#3a3a41;background:#24242a;box-shadow:var(--sh-1)}
.card.dragging{opacity:.32;filter:grayscale(.3)}
.card-top{display:flex;align-items:center;gap:9px}
.card-ava{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font-weight:600;font-size:12.5px;
  background:#2c2c33;color:var(--gold-2);flex:none}
.card-mid{min-width:0;flex:1;overflow:hidden}
.card-name{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.card-phone{font-size:12px;color:var(--text-2);font-variant-numeric:tabular-nums;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-phone-row{display:flex;align-items:center;gap:7px;margin-top:1px;min-width:0}
.card-phone-row .card-phone{flex:1;min-width:0}
.card-menu{right:8px}
.card-top{padding-right:18px}
.card-sdot{margin-left:auto;width:9px;height:9px;border-radius:50%;flex:none;box-shadow:0 0 0 3px rgba(255,255,255,.04)}
.card-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.tag{font-size:10.5px;font-weight:600;color:var(--text-2);background:#2a2a30;border-radius:6px;padding:2px 7px}
.tag.gold{color:var(--gold-2);background:rgba(197,160,89,.12)}
.tag.loss{color:#f08581;background:rgba(229,57,53,.13);display:inline-flex;align-items:center;gap:3px}
.tag.loss svg{width:11px;height:11px}
.card-menu{position:absolute;top:7px;right:8px;width:26px;height:26px;border-radius:7px;display:grid;place-items:center;color:#56565e;
  opacity:0;transition:opacity .15s var(--ease)}
.card:hover .card-menu{opacity:1}
.card-menu:hover{background:#2c2c33;color:#fff}
/* ===== H7: segmented control expands IN PLACE into drop-zones while a card is held ===== */
.seg.dz-arm{height:74px;transition:height .2s var(--ease)}
.seg.dz-arm .seg-glide{opacity:0}
.seg.dz-arm .seg-opt{height:66px;flex-direction:column;gap:3px;border-radius:11px;border:2px dashed transparent;
  transition:border-color .16s var(--ease),background .16s var(--ease),transform .16s var(--ease),color .16s var(--ease)}
.seg.dz-arm .seg-opt svg{width:20px;height:20px}
.seg.dz-arm .seg-opt[data-tab="students"]{border-color:var(--gold-line);background:rgba(197,160,89,.05);color:#fff}
.seg.dz-arm .seg-opt[data-tab="students"] svg{color:var(--gold)}
.seg.dz-arm .seg-opt.dz-hot{border-color:var(--gold);background:rgba(197,160,89,.16);transform:scale(1.03);color:var(--gold)}
.seg.dz-arm .seg-opt.dz-hot svg{color:var(--gold)}
.seg.dz-arm .seg-opt .dz-cap{font-size:10px;font-weight:700;color:var(--gold-2);letter-spacing:.02em;display:none}
.seg.dz-arm .seg-opt[data-tab="students"] .dz-cap{display:block}
/* dwell progress ring on the hot zone */
.seg.dz-arm .seg-opt.dz-hot::after{content:"";position:absolute;left:8px;right:8px;bottom:6px;height:3px;border-radius:99px;
  background:linear-gradient(90deg,var(--gold) var(--dwell,0%),rgba(197,160,89,.18) var(--dwell,0%))}

/* G3 insertion line */
.ins-line{height:0;position:relative}
.ins-line::after{content:"";position:absolute;left:2px;right:2px;top:-5px;height:2.5px;border-radius:2px;background:var(--gold);
  box-shadow:0 0 8px rgba(197,160,89,.7)}

/* drag ghost */
#dragGhost{position:fixed;left:0;top:0;width:236px;pointer-events:none;z-index:var(--z-drag);
  transform:translate(-9999px,-9999px) scale(1.03);opacity:0;
  filter:drop-shadow(0 18px 44px rgba(0,0,0,.6));transition:opacity .12s var(--ease)}
#dragGhost .card{cursor:grabbing;border-color:var(--gold-line);background:#26261c;box-shadow:var(--sh-lift)}
#dragGhost.on{opacity:1}
html.dragging-active,html.dragging-active *{cursor:grabbing!important}

/* ===== Ученики board overlay (continuous transfer destination) ===== */
.stu-overlay{position:absolute;inset:0;z-index:var(--z-nav);background:rgba(16,16,18,.5);backdrop-filter:blur(3px);
  display:none;flex-direction:column;opacity:0;transition:opacity .24s var(--ease)}
.stu-overlay.show{display:flex;opacity:1}
.stu-overlay .so-head{flex:none;display:flex;align-items:center;gap:10px;padding:14px 16px 10px}
.stu-overlay .so-head b{font-size:15px;font-weight:700}
.stu-overlay .so-head small{font-size:11.5px;color:var(--text-2);display:block;margin-top:1px}
.stu-overlay .so-body{flex:1;min-height:0;overflow:auto;padding:4px 16px 18px}
/* branch drop-zones (G6) */
.branch-zones{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.bzone{min-height:120px;border-radius:16px;border:2px dashed var(--gold-line);background:rgba(197,160,89,.05);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:18px 14px;
  transition:transform .18s var(--ease),border-color .18s var(--ease),background .18s var(--ease)}
.bzone .bz-ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:rgba(197,160,89,.12);color:var(--gold)}
.bzone b{font-size:15px;font-weight:700}
.bzone small{font-size:12px;color:var(--text-2)}
.bzone.arm{border-style:dashed;border-color:var(--gold);background:rgba(197,160,89,.13);transform:scale(1.03)}
/* discipline columns within a branch */
.disc-cols{display:flex;gap:12px;align-items:flex-start;width:max-content;min-height:100%;padding-bottom:6px}
.dzone{width:208px;flex:none;min-height:150px;border-radius:14px;border:2px dashed var(--gold-line);background:rgba(197,160,89,.04);
  display:flex;flex-direction:column;transition:transform .16s var(--ease),border-color .16s var(--ease),background .16s var(--ease)}
.dzone .dz-head{padding:12px 13px 9px;display:flex;align-items:center;gap:8px}
.dzone .dz-head b{font-size:13.5px;font-weight:600}
.dzone .dz-head .cnt{margin-left:auto;font-size:11.5px;color:var(--text-2);background:#232327;border-radius:6px;padding:1px 7px}
.dzone .dz-body{flex:1;min-height:0;overflow:auto;padding:2px 10px 12px;display:flex;flex-direction:column;gap:8px}
.dzone.misc{border-color:rgba(161,161,170,.4);background:rgba(161,161,170,.05)}
.dzone.arm{border-color:var(--gold);background:rgba(197,160,89,.12);transform:scale(1.02)}
.dzone .dz-hint{font-size:11px;color:#56565e;text-align:center;padding:14px 8px;font-weight:500}

/* ============================== DRAWER / SHEET / PREVIEW ============================== */
.scrim{position:absolute;inset:0;background:rgba(8,8,10,.58);backdrop-filter:blur(2px);opacity:0;visibility:hidden;
  transition:opacity .26s var(--ease),visibility .26s var(--ease);z-index:var(--z-drawer-back)}
.scrim.show{opacity:1;visibility:visible}
.drawer{position:absolute;top:0;right:0;bottom:0;width:380px;max-width:92%;background:var(--surface);
  border-left:1px solid var(--divider);box-shadow:var(--sh-2);transform:translateX(100%);
  transition:transform .3s var(--ease);z-index:var(--z-drawer);display:flex;flex-direction:column}
.drawer.show{transform:translateX(0)}
.drawer-head{flex:none;display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--divider)}
.drawer-head h3{font-size:16px;font-weight:700;letter-spacing:-.01em}
.drawer-body{padding:18px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:18px}
.drawer-foot{flex:none;padding:14px 18px;border-top:1px solid var(--divider);display:flex;gap:10px}

.sheet-scrim{position:absolute;inset:0;background:rgba(8,8,10,.6);backdrop-filter:blur(2px);opacity:0;visibility:hidden;
  transition:opacity .24s var(--ease),visibility .24s var(--ease);z-index:var(--z-sheet-back)}
.sheet-scrim.show{opacity:1;visibility:visible}
.sheet{position:absolute;left:50%;bottom:0;width:460px;max-width:100%;background:var(--surface);
  border:1px solid var(--divider);border-bottom:none;border-radius:18px 18px 0 0;box-shadow:var(--sh-2);
  transform:translate(-50%,100%);transition:transform .32s var(--ease);z-index:var(--z-sheet);
  display:flex;flex-direction:column;max-height:90%}
.sheet.show{transform:translate(-50%,0)}
.sheet-grab{flex:none;width:40px;height:4px;border-radius:99px;background:#3a3a40;margin:10px auto 2px}
.sheet-head{flex:none;display:flex;align-items:flex-start;gap:12px;padding:8px 20px 13px;border-bottom:1px solid var(--divider)}
.sheet-head h3{font-size:17px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-head p{font-size:12.5px;color:var(--text-2);margin-top:2px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.sheet-head>div{min-width:0}
.sheet-head .icon-badge{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;flex:none;
  background:var(--gold-soft);color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold-line)}
.sheet-body{padding:16px 20px;overflow-y:auto;display:flex;flex-direction:column;gap:15px}
.sheet-foot{flex:none;padding:13px 20px 18px;border-top:1px solid var(--divider);display:flex;gap:10px}

/* card preview / full client card */
.kv{display:flex;flex-direction:column;gap:3px}
.kv label{font-size:11.5px;color:var(--text-2);font-weight:600}
.kv span{font-size:14px}
.note{background:var(--input);border:1px solid var(--divider);border-radius:11px;padding:11px 12px;font-size:13px;color:#d4d4d8;line-height:1.5}
.unsaved{display:flex;align-items:center;gap:9px;background:rgba(229,57,53,.1);border:1px solid rgba(229,57,53,.32);
  color:#f4a3a1;border-radius:11px;padding:10px 12px;font-size:12.5px;font-weight:500}
.unsaved svg{color:var(--danger);width:18px;height:18px;flex:none}
.sec-tabs{display:flex;gap:4px;background:var(--input);border:1px solid var(--divider);border-radius:11px;padding:4px;overflow-x:auto}
.sec-tab{flex:1;min-width:max-content;height:32px;padding:0 12px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--text-2);
  white-space:nowrap;transition:all .15s var(--ease)}
.sec-tab.on{background:var(--surface);color:#fff;box-shadow:var(--sh-1),inset 0 0 0 1px var(--gold-line)}
.task-row,.fam-row,.hist-row,.cmt-row{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--divider)}
.task-row:last-child,.fam-row:last-child,.hist-row:last-child,.cmt-row:last-child{border-bottom:none}
.tk-check{width:20px;height:20px;border-radius:6px;border:1.5px solid #3a3a42;flex:none;margin-top:1px;display:grid;place-items:center;color:transparent}
.tk-check.done{background:var(--gold);border-color:var(--gold);color:#1a1408}
.hist-dot{width:9px;height:9px;border-radius:50%;flex:none;margin-top:5px;box-shadow:0 0 0 3px rgba(255,255,255,.04)}

/* column config */
.cc-list{display:flex;flex-direction:column;gap:8px}
.cc-row{display:flex;align-items:center;gap:10px;background:var(--input);border:1px solid var(--divider);
  border-radius:11px;padding:9px 11px;transition:box-shadow .15s var(--ease),border-color .15s var(--ease)}
.cc-row.cc-drag{box-shadow:var(--sh-2);border-color:var(--gold-line);background:#26261c;z-index:2}
.cc-grip{color:#56565e;cursor:grab;touch-action:none;display:grid;place-items:center;width:24px;height:30px;flex:none}
.cc-row input{background:none;border:none;outline:none;color:#fff;font-size:13.5px;font-weight:600;flex:1;min-width:0;
  border-bottom:1px dashed transparent;padding:2px 0}
.cc-row input:focus{border-bottom-color:var(--gold-line)}
.cc-del{color:#5a5a62;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none}
.cc-del:hover{color:var(--danger);background:rgba(229,57,53,.1)}

/* ============================== SCHEDULE ============================== */
.month-h b{font-size:19px;font-weight:700;letter-spacing:-.02em;display:block}
.month-h small{font-size:12px;color:var(--text-2)}
.daystrip{display:flex;gap:7px;overflow-x:auto;flex:1;min-width:0}
.day{flex:none;width:50px;height:60px;border-radius:12px;background:var(--surface);border:1px solid var(--divider);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;transition:all .16s var(--ease)}
.day small{font-size:11px;color:var(--text-2);font-weight:600}
.day b{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.day .has{width:5px;height:5px;border-radius:50%;background:var(--gold)}
.day:hover{border-color:#3a3a41}
.day.on{background:var(--gold);border-color:transparent}
.day.on small,.day.on b{color:#1a1408}
.day.on .has{background:#1a1408}
/* K10 fix: NO horizontal padding on the scroll container — sticky left:0 must hug the true
   left edge, else scrolled cells bleed through the padding gap to the left of the time column. */
.grid-wrap{flex:1;min-height:0;overflow:auto;padding:0 0 18px}
.calendar{position:relative;min-width:max-content}
/* H5 fix: NO overflow:hidden here — it would trap position:sticky inside the grid and break pinning.
   Rounded outer edge is provided by .grid-wrap padding + the grid's own border. */
.cal-grid{display:grid;border:1px solid var(--divider);border-radius:12px;background:var(--surface);position:relative}
.cal-grid>.cal-corner{border-top-left-radius:12px}
/* H5: sticky-header layering — cells(2) < lessons(3) < time-col(7)/room-head(8) < corner(9) < dropzones/sheet */
.cal-corner{position:sticky;left:0;top:0;z-index:9;background:var(--sidebar);border-right:1px solid var(--divider);
  border-bottom:1px solid var(--divider);display:grid;place-items:center;font-size:11px;color:var(--text-2);font-weight:600;
  box-shadow:2px 2px 8px rgba(0,0,0,.3)}
.col-head{position:sticky;top:0;z-index:8;background:var(--sidebar);border-bottom:1px solid var(--divider);
  border-right:1px solid var(--divider);padding:9px 11px;display:flex;align-items:center;gap:8px;min-width:0;
  box-shadow:0 3px 8px rgba(0,0,0,.28)}
.col-head .ch-ic{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex:none;background:#26262b;color:var(--gold-2)}
.col-head>div{min-width:0;flex:1}
.col-head b{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.col-head small{display:block;font-size:10.5px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.time-cell{position:sticky;left:0;z-index:7;background:var(--sidebar);border-right:1px solid var(--divider);
  border-bottom:1px solid var(--divider);display:flex;align-items:flex-start;justify-content:flex-end;
  padding:5px 9px 0;font-size:11.5px;color:var(--text-2);font-variant-numeric:tabular-nums;font-weight:600;
  box-shadow:3px 0 8px rgba(0,0,0,.28)}
.cell{border-right:1px solid var(--divider);border-bottom:1px solid var(--divider);position:relative;cursor:pointer;
  transition:background .12s var(--ease)}
.cell:hover{background:rgba(197,160,89,.05)}
/* K5: teacher cannot create lessons — cells are inert (no booking cursor/hover) */
html[data-role="teacher"] .cell{cursor:default}
html[data-role="teacher"] .cell:hover{background:none}
.cell.sel{background:var(--gold-soft);box-shadow:inset 0 0 0 1px var(--gold-line)}
.cell.selecting{background:rgba(197,160,89,.2)}
html.vselecting,html.vselecting *{cursor:ns-resize!important;user-select:none}
.lessons-layer{position:absolute;inset:0;pointer-events:none;z-index:3}
.lesson{position:absolute;border-radius:10px;padding:8px 10px;overflow:hidden;pointer-events:auto;cursor:pointer;
  background:linear-gradient(180deg,rgba(197,160,89,.26),rgba(197,160,89,.16));
  border:1px solid var(--gold-line);box-shadow:var(--sh-1);
  transition:transform .14s var(--ease),box-shadow .14s var(--ease);display:flex;flex-direction:column;gap:2px}
.lesson:hover{transform:translateY(-1px);box-shadow:var(--sh-2);z-index:4}
.lesson .ls-time{font-size:10.5px;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.lesson .ls-stu{font-size:12.5px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lesson .ls-tea{font-size:11px;color:#d8d2c4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* short-lesson legibility: tighten / drop secondary lines so text never chews */
.lesson.compact{padding:6px 9px;gap:1px;justify-content:center}
.lesson.compact .ls-time{font-size:9.5px}
.lesson.compact .ls-stu{font-size:12px}
.lesson.compact .ls-tea{display:none}
.lesson.tiny{flex-direction:row;align-items:center;gap:6px;padding:0 9px}
.lesson.tiny .ls-stu{font-size:11.5px;flex:1;min-width:0}
.lesson.tiny .ls-mini{font-size:9.5px;font-weight:700;color:var(--gold);flex:none;font-variant-numeric:tabular-nums}
.lesson.partial::after{content:"";position:absolute;left:0;right:0;bottom:0;height:var(--cut,0%);
  background:repeating-linear-gradient(135deg,rgba(0,0,0,.16) 0 5px,transparent 5px 10px);pointer-events:none}
.lesson.justbooked{animation:bookPop .42s var(--ease)}
@keyframes bookPop{0%{transform:scale(.96)}60%{transform:scale(1.01)}100%{transform:scale(1)}}
.dur-pad{display:flex;flex-wrap:wrap;gap:8px}
.dur-disp{display:flex;align-items:baseline;gap:4px;font-variant-numeric:tabular-nums}
.dur-disp b{font-size:28px;font-weight:700;letter-spacing:-.02em}
.dur-disp small{font-size:13px;color:var(--text-2)}
.stepper{display:flex;align-items:center;gap:10px}
.step-btn{width:40px;height:40px;border-radius:10px;background:var(--input);border:1px solid var(--divider);
  display:grid;place-items:center;color:#fff;transition:all .14s var(--ease)}
.step-btn:hover{border-color:var(--gold-line);background:#26261c}
/* H6: conflict warning inside the booking sheet */
.conflict{display:flex;gap:11px;align-items:flex-start;background:rgba(229,57,53,.1);border:1px solid rgba(229,57,53,.36);
  border-radius:12px;padding:12px 13px;animation:conflictIn .26s var(--ease)}
@keyframes conflictIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.conflict .cf-ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;flex:none;background:rgba(229,57,53,.16);color:var(--danger)}
.conflict .cf-tx{min-width:0;flex:1}
.conflict .cf-tx b{font-size:13px;font-weight:700;color:#f4a3a1;display:block}
.conflict .cf-tx p{font-size:12.5px;color:#e9b4b2;margin-top:3px;line-height:1.45;overflow-wrap:anywhere}
.conflict .cf-tx .cf-list{margin-top:7px;display:flex;flex-direction:column;gap:5px}
.conflict .cf-occ{display:flex;align-items:center;gap:7px;font-size:12px;color:#f0c8c6;background:rgba(229,57,53,.1);
  border-radius:8px;padding:5px 8px;min-width:0}
.conflict .cf-occ .dot{background:var(--danger)}
.conflict .cf-occ span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn.danger{background:rgba(229,57,53,.14);border-color:rgba(229,57,53,.4);color:#f4a3a1}
.btn.danger:hover{background:rgba(229,57,53,.2)}

/* ============================== USERS ============================== */
.users-list{background:var(--surface);border:1px solid var(--divider);border-radius:14px;overflow:hidden}
.user-row{display:flex;align-items:center;gap:13px;padding:13px 16px;border-top:1px solid var(--divider);cursor:pointer;transition:background .14s var(--ease)}
.user-row:first-child{border-top:none}
.user-row:hover{background:#202024}
.user-row .ava{width:42px;height:42px;font-size:14px;flex:none}
/* K13: clean readable columns at 390 & 1440 — avatar · name+contact · branch · role chip · actions */
.user-row .u-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.user-row .u-main .ell{font-weight:600;font-size:14.5px}
.user-row .u-contact{font-size:12px;color:var(--text-2);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.user-row .u-branch{flex:none;width:118px;min-width:0;font-size:12.5px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:none}
html[data-frame="desktop"] .user-row .u-branch{display:block}
.kind-chip{font-size:11px;font-weight:600;padding:3px 9px;border-radius:7px;background:#2a2a30;color:var(--text-2);display:inline-flex;flex:none;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kind-chip.gold{background:rgba(197,160,89,.13);color:var(--gold-2)}
.role-chip{font-size:11.5px;font-weight:700;padding:4px 11px;border-radius:8px;display:inline-flex;align-items:center;gap:6px;flex:none;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
/* K13: on the narrow phone frame, drop the role-chip text label (keep icon+chip in actions) to avoid cramping */
html[data-frame="phone"] .user-row .role-chip{display:none}
.role-chip.mgr{background:rgba(197,160,89,.14);color:var(--gold)}
.role-chip.adm{background:rgba(122,162,247,.13);color:#9bb6f5}
.role-chip.sys{background:rgba(191,163,126,.18);color:#d8c19a;box-shadow:inset 0 0 0 1px var(--gold-line)}
.user-row .u-act{display:flex;align-items:center;gap:4px;flex:none}
/* v7 pass-2: user → CRM link chip */
.u-link{margin-top:3px}
.link-chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:7px;
  background:#26262b;color:var(--text-2);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.link-chip svg{flex:none;color:#6e6e76}
.link-chip.on{background:rgba(16,185,129,.12);color:#7fd9bd}
.link-chip.on svg{color:#7fd9bd}
/* J3/I9: role-change control (Управляющий only; disabled "Только Управляющий" for Администратор) */
.role-edit{font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:8px;display:inline-flex;align-items:center;gap:5px;
  background:var(--input);border:1px solid var(--divider);color:var(--text-2);flex:none;white-space:nowrap;transition:all .15s var(--ease)}
.role-edit:hover{border-color:var(--gold-line);color:#fff}
.role-edit svg{width:13px;height:13px}
.role-edit[disabled]{opacity:.5;cursor:not-allowed}
.role-edit[disabled]:hover{border-color:var(--divider);color:var(--text-2)}
.role-edit span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* K13: phone — role-edit shows icon only (text would crowd the narrow row) */
html[data-frame="phone"] .role-edit span{display:none}
html[data-frame="phone"] .role-edit{padding:6px}

/* ============================== PROFILE / PORTAL ============================== */
.prof-hero{display:flex;flex-direction:column;align-items:center;gap:12px;padding:22px 18px 8px;text-align:center}
.prof-hero .ava{width:84px;height:84px;font-size:30px;box-shadow:inset 0 0 0 1px var(--gold-line)}
.prof-hero h2{font-size:20px;font-weight:700;letter-spacing:-.015em}
.list-card{background:var(--surface);border:1px solid var(--divider);border-radius:14px;overflow:hidden}
.list-row{display:flex;align-items:center;gap:13px;padding:14px 16px;border-top:1px solid var(--divider)}
.list-row:first-child{border-top:none}
.list-row .lr-ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:#26262b;color:var(--gold-2);flex:none}
.list-row .lr-txt{flex:1;min-width:0}
.list-row .lr-txt b{font-size:14px;font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-row .lr-txt small{font-size:12px;color:var(--text-2);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-row .lr-r{color:var(--text-2)}
.sub-card{border-radius:16px;padding:18px;background:linear-gradient(135deg,#231d12,#191813);border:1px solid var(--gold-line);position:relative;overflow:hidden}
.sub-card::after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;
  background:radial-gradient(circle,rgba(197,160,89,.22),transparent 68%)}
.sub-card .sc-top{display:flex;align-items:center;justify-content:space-between;position:relative}
.sub-card .sc-plan{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gold)}
.sub-card .sc-big{font-size:26px;font-weight:800;letter-spacing:-.02em;margin-top:8px;position:relative}
.sub-card .sc-sub{font-size:12.5px;color:#c9bfa6;margin-top:2px;position:relative}
.sub-card .sc-bar{height:7px;border-radius:99px;background:rgba(0,0,0,.3);margin-top:14px;overflow:hidden;position:relative}
.sub-card .sc-bar i{display:block;height:100%;border-radius:99px;background:var(--gold)}
.kid-switch{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.kid-chip{flex:none;display:flex;align-items:center;gap:9px;padding:7px 13px 7px 7px;border-radius:99px;background:var(--input);
  border:1px solid var(--divider);transition:all .15s var(--ease)}
.kid-chip .ava{width:30px;height:30px;font-size:12px}
.kid-chip b{font-size:13px;font-weight:600}
.kid-chip.on{background:var(--gold-soft);border-color:var(--gold-line)}
.kid-chip.on b{color:var(--gold)}

/* ============================== J4: REPORTS / FINANCE / TASKS / STUDENTS (v3-native styling) ============================== */
/* report/finance cards reuse v3's surface+divider+radius language */
.rep-grid{display:grid;grid-template-columns:1fr;gap:12px;padding:14px 16px 20px}
html[data-frame="desktop"] .rep-grid{grid-template-columns:repeat(2,1fr);gap:14px;padding:16px 22px 22px}
.rcard{background:var(--surface);border:1px solid var(--divider);border-radius:var(--r-card);padding:15px 16px;cursor:pointer;
  transition:border-color .16s var(--ease),box-shadow .16s var(--ease),transform .1s var(--ease);min-width:0}
.rcard:hover{border-color:#34343a;box-shadow:var(--sh-1)}
.rcard:active{transform:translateY(1px)}
.rcard h5{font-size:12px;font-weight:700;color:var(--text-2);text-transform:uppercase;letter-spacing:.05em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rcard .big{font-size:26px;font-weight:800;letter-spacing:-.02em;margin-top:8px;font-variant-numeric:tabular-nums}
.rcard .delta{font-size:12px;font-weight:600;margin-top:3px;display:inline-flex;align-items:center;gap:5px}
.rcard .delta.up{color:var(--success)}.rcard .delta.down{color:#f0a3a1}
.rcard .rfoot{font-size:13px;color:var(--text-2);margin-top:8px;line-height:1.5;overflow-wrap:anywhere}
.rcard.rcard-wide{cursor:default}
html[data-frame="desktop"] .rcard-wide{grid-column:1/-1}
/* J6: manager Настройки */
.set-grid{display:grid;grid-template-columns:1fr;gap:12px}
html[data-frame="desktop"] .set-grid{grid-template-columns:repeat(2,1fr);gap:14px}
.set-card{background:var(--surface);border:1px solid var(--divider);border-radius:var(--r-card);padding:15px 16px;min-width:0;display:flex;flex-direction:column;gap:8px}
.set-card .set-head b{font-size:14px;font-weight:700;letter-spacing:-.01em;display:block}
.set-card .set-head small{font-size:12px;color:var(--text-2);display:block;margin-top:2px}
.set-card .btn{align-self:flex-start}
.set-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.set-row{display:flex;align-items:center;gap:10px;background:var(--input);border:1px solid var(--divider);border-radius:var(--r-ctrl);padding:9px 11px;min-width:0}
.set-row .dot{width:9px;height:9px;flex:none}
.set-row .sr-main{flex:1;min-width:0}
.set-row .sr-main b{font-size:13.5px;font-weight:600;display:block}
.set-row .sr-main small{font-size:11.5px;color:var(--text-2);display:block}
.set-row .icon-btn{width:32px;height:32px;flex:none}
/* per-branch nested config (student funnel + rooms inside each филиал) */
.set-section-label{grid-column:1/-1;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font-size:13px;font-weight:700;color:var(--text);padding:8px 2px 0;letter-spacing:-.01em}
.set-section-label small{font-weight:500;font-size:11.5px;color:var(--text-2)}
.set-branch-head{display:flex;align-items:center;gap:10px}
.set-branch-head .dot{width:9px;height:9px;flex:none}
.set-sub{background:var(--input);border:1px solid var(--divider);border-radius:var(--r-ctrl);padding:11px 12px;display:flex;flex-direction:column;gap:7px;min-width:0}
.set-sub-h{font-size:12.5px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:6px}
.set-sub-h .tnum{color:var(--text-2);font-weight:600}
.set-sub .set-row{background:var(--surface)}
.set-sub .btn{align-self:flex-start}
.set-empty{font-size:12px;color:var(--text-2);padding:2px}
.set-grid>button[data-setadd]{grid-column:1/-1;justify-content:center}
/* funnel / comparison bars (inline) */
.funnel{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.funnel .fr{display:flex;align-items:center;gap:10px;min-width:0}
.funnel .fl{width:96px;flex:none;font-size:12px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.funnel .ftrack{flex:1;min-width:0;height:26px;border-radius:8px;background:var(--input);overflow:hidden}
.funnel .fbar{height:100%;border-radius:8px;background:linear-gradient(90deg,var(--gold-2),var(--gold));
  display:flex;align-items:center;padding:0 10px;font-size:12px;font-weight:700;color:#1a1408;min-width:34px}
.funnel .fbar.muted{background:#3a3a40;color:#cfcfd4}
/* bar sparkline */
.bars{display:flex;align-items:flex-end;gap:4px;height:54px;margin-top:14px}
.bars i{flex:1;border-radius:3px 3px 0 0;background:var(--gold);min-height:3px}
.spark{margin-top:12px}
.spark svg{display:block;width:100%;height:54px;overflow:visible}
/* tasks list (reuses list-card look) */
.task-list .task-item{display:flex;align-items:flex-start;gap:12px;padding:13px 16px;border-top:1px solid var(--divider);cursor:pointer;transition:background .14s var(--ease)}
.task-list .task-item:first-child{border-top:none}
.task-list .task-item:hover{background:#202024}
.task-list .task-item .ti-txt{min-width:0;flex:1}
.task-list .task-item .ti-txt b{font-size:14px;font-weight:600;display:block}
.task-list .task-item.tdone .ti-txt b{color:var(--text-2);text-decoration:line-through}
.task-list .task-item .ti-txt small{font-size:12px;color:var(--text-2);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ============================== MENU POPOVER ============================== */
/* J3/I7: width-capped so long items (branch names, role labels) can't overflow the popover */
.popmenu{position:absolute;z-index:var(--z-tooltip);min-width:210px;max-width:min(280px,calc(100% - 16px));background:#202024;border:1px solid var(--divider);
  border-radius:13px;box-shadow:var(--sh-2);padding:6px;opacity:0;visibility:hidden;transform:scale(.96) translateY(-4px);
  transform-origin:top right;transition:opacity .16s var(--ease),transform .16s var(--ease),visibility .16s}
.popmenu.show{opacity:1;visibility:visible;transform:scale(1) translateY(0)}
.pm-item{display:flex;align-items:center;gap:11px;height:40px;padding:0 11px;border-radius:9px;font-size:13.5px;font-weight:500;color:#e6e6ea;width:100%}
.pm-item svg{width:17px;height:17px;color:var(--text-2)}
/* J3/I7: dropdown item label truncates instead of overflowing */
.pm-item span{min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pm-item:hover{background:#2a2a30}
.pm-item.danger{color:#f08581}.pm-item.danger svg{color:#e06560}
.pm-item.danger:hover{background:rgba(229,57,53,.1)}
.pm-sep{height:1px;background:var(--divider);margin:5px 4px}
.pm-sub{font-size:10.5px;font-weight:700;color:#56565e;text-transform:uppercase;letter-spacing:.06em;padding:8px 11px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ============================== TOAST / TOOLTIP / EMPTY ============================== */
.toast-wrap{position:absolute;left:50%;bottom:78px;transform:translateX(-50%);z-index:var(--z-toast);
  display:flex;flex-direction:column;gap:10px;align-items:center;width:max-content;max-width:90%}
.toast{display:flex;align-items:center;gap:12px;background:#202024;border:1px solid var(--divider);border-radius:13px;padding:12px 14px;
  box-shadow:var(--sh-2);min-width:0;width:min(360px,calc(100% - 24px));max-width:100%;transform:translateY(20px) scale(.98);opacity:0;
  transition:transform .3s var(--ease),opacity .3s var(--ease)}
.toast.show{transform:translateY(0) scale(1);opacity:1}
.toast .t-ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;background:rgba(16,185,129,.16);color:var(--success)}
.toast .t-txt{flex:1;min-width:0}
.toast .t-txt b{font-size:13.5px;font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast .t-txt small{font-size:12px;color:var(--text-2);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast .t-undo{font-size:13px;font-weight:700;color:var(--gold);padding:6px 11px;border-radius:8px;white-space:nowrap}
.toast .t-undo:hover{background:var(--gold-soft)}
.tip{position:relative}
.tip[data-tip]:hover::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);
  background:#000;color:#fff;font-size:11.5px;font-weight:500;padding:6px 10px;border-radius:8px;white-space:nowrap;
  z-index:var(--z-tooltip);box-shadow:var(--sh-2);pointer-events:none;border:1px solid var(--divider)}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:13px;height:100%;padding:36px;text-align:center}
.empty .e-ic{width:60px;height:60px;border-radius:18px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--divider);color:var(--gold-2)}
.empty h3{font-size:16px;font-weight:700}
.empty p{font-size:13px;color:var(--text-2);max-width:280px}

/* ============================== FRAME-SPECIFIC LAYOUT ============================== */
/* desktop chat = 2-pane fixed list width; phone chat = single pane swap */
html[data-frame="desktop"] .chat-list{width:340px}
html[data-frame="desktop"] .chat-list .cl-mobile-bar{display:none}
html[data-frame="phone"] .chat-shell.at-list .conv{display:none}
html[data-frame="phone"] .chat-shell.at-conv .chat-list{display:none}
html[data-frame="phone"] .chat-list{width:100%;flex:1}
html[data-frame="phone"] .conv{width:100%}
html[data-frame="phone"] .conv-head .ch-back{display:grid}
html[data-frame="desktop"] .conv-head .ch-back{display:none}
.conv-head .ch-back{width:38px;height:38px;border-radius:10px;place-items:center;color:var(--text-2)}
.conv-head .ch-back:hover{background:#1e1e22;color:#fff}

/* phone: appbar visible, rail hidden; desktop: rail visible, appbar context varies */
html[data-frame="phone"] .rail,html[data-frame="phone"] .desk-shell{display:none}
html[data-frame="phone"] .ab-back{display:flex}
html[data-frame="desktop"] .tabbar{display:none}
html[data-frame="desktop"] .app>.appbar{display:none}
/* desktop content header band sizes */
html[data-frame="desktop"] .head-band{padding:16px 22px 12px}
html[data-frame="desktop"] .tools-band{padding:0 22px 14px}
html[data-frame="desktop"] .hint-bar{padding:0 22px 10px}
html[data-frame="desktop"] .kanban-wrap,html[data-frame="desktop"] .grid-wrap{padding-left:22px;padding-right:22px}
html[data-frame="desktop"] .kcol{width:262px}
html[data-frame="desktop"] .branch-zones{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
html[data-frame="desktop"] .stu-overlay .so-body{padding:6px 22px 20px}

/* RBAC: hide manager-only when admin */
html[data-role="admin"] [data-mgr]{display:none!important}
/* H2: phone numbers + call buttons are staff-only. In client portal / teacher context, the app
   sets data-pov="client" or "teacher" on the relevant subtree → numbers & call hidden entirely. */
[data-pov="client"] .staff-phone,[data-pov="teacher"] .staff-phone,
[data-pov="client"] .call-link,[data-pov="teacher"] .call-link{display:none!important}

/* H1: call link → device dialer (tel:). 44px touch target, tooltip "Позвонить". */
a.call-link{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:10px;flex:none;
  color:var(--gold-2);background:rgba(197,160,89,.1);box-shadow:inset 0 0 0 1px var(--gold-line);
  transition:background .16s var(--ease),color .16s var(--ease),transform .1s var(--ease);position:relative;text-decoration:none}
a.call-link::before{content:"";position:absolute;inset:-5px} /* expand hit area to ≥44px */
a.call-link:hover{background:var(--gold-soft);color:var(--gold)}
a.call-link:active{transform:scale(.92)}
a.call-link svg{width:17px;height:17px}
a.call-link.sm{width:30px;height:30px}a.call-link.sm svg{width:15px;height:15px}
/* J3/I1 final: NO call icon on DESKTOP anywhere; NO call icon on the Клиенты kanban cards.
   Call stays ONLY in the phone chat header + the phone open-card phone line. */
html[data-frame="desktop"] a.call-link{display:none!important}
.card a.call-link{display:none!important}

/* ============================== v6 K2: LOGIN / AUTH (v5 style) ============================== */
.auth-screen{position:absolute;inset:0;z-index:var(--z-sheet);display:flex;flex-direction:column;overflow:auto;
  background:radial-gradient(900px 500px at 50% -10%,rgba(197,160,89,.10),transparent 60%),var(--bg)}
.auth-screen.hidden{display:none}
.auth-inner{margin:auto;width:100%;max-width:360px;padding:30px 26px;display:flex;flex-direction:column;gap:16px}
html[data-frame="desktop"] .auth-inner{max-width:400px}
.auth-brand{display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:4px}
.auth-brand .lm{width:62px;height:62px;border-radius:18px;display:grid;place-items:center;
  background:linear-gradient(150deg,#2a2418,#1d1a12);box-shadow:inset 0 0 0 1px var(--gold-line)}
.auth-brand .lm svg{color:var(--gold)}
.auth-brand b{font-size:21px;font-weight:800;letter-spacing:-.02em}
.auth-brand b span{color:var(--gold)}
.auth-brand small{font-size:12.5px;color:var(--text-2)}
.auth-screen .field>label{font-size:12px}
.auth-err{display:none;font-size:12px;color:#f4a3a1;background:rgba(229,57,53,.1);border:1px solid rgba(229,57,53,.32);
  border-radius:9px;padding:8px 11px}
.auth-err.show{display:block}
.auth-sep{display:flex;align-items:center;gap:10px;color:#56565e;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.auth-sep::before,.auth-sep::after{content:"";flex:1;height:1px;background:var(--divider)}
.auth-roles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.auth-role{display:flex;align-items:center;gap:9px;height:44px;padding:0 12px;border-radius:var(--r-ctrl);background:var(--input);
  border:1px solid var(--divider);font-size:13px;font-weight:600;color:var(--text-2);transition:all .15s var(--ease);min-width:0}
.auth-role svg{width:16px;height:16px;color:var(--gold-2);flex:none}
.auth-role span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.auth-role:hover{border-color:var(--gold-line);color:#fff}
.auth-link{font-size:13px;font-weight:600;color:var(--gold);text-align:center;padding:6px;cursor:pointer}
.auth-link:hover{text-decoration:underline}
/* v7 pass-2: auth depth — otp boxes, note, resend */
.auth-note{font-size:12.5px;color:var(--text-2);line-height:1.5;text-align:center;margin:-4px 0 2px}
.auth-note b{color:#e6e6ea}
.otp-row{display:flex;gap:8px;justify-content:center}
.otp-box{flex:1;max-width:50px;height:54px;text-align:center;font-size:22px;font-weight:700;
  border-radius:var(--r-ctrl);background:var(--input);border:1px solid var(--divider);color:#fff;transition:border-color .15s,box-shadow .15s}
.otp-box:focus{outline:none;border-color:var(--gold-line);box-shadow:0 0 0 3px var(--gold-soft)}
.auth-resend{font-size:12.5px;color:var(--text-2);text-align:center}
/* v7 pass-2: onboarding slides + legal consent */
.ob-inner{align-items:center;text-align:center;gap:14px}
.ob-illo{width:92px;height:92px;border-radius:26px;display:grid;place-items:center;
  background:linear-gradient(150deg,#2a2418,#1d1a12);box-shadow:inset 0 0 0 1px var(--gold-line);color:var(--gold);margin-bottom:4px}
.ob-title{font-size:21px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.ob-text{font-size:13.5px;color:var(--text-2);line-height:1.55;max-width:300px}
.ob-dots{display:flex;gap:7px;justify-content:center;margin:4px 0 4px}
.ob-dot{width:7px;height:7px;border-radius:50%;background:var(--divider);transition:background .2s,width .2s}
.ob-dot.on{width:20px;border-radius:99px;background:var(--gold)}
.consent-list{display:flex;flex-direction:column;gap:9px}
.consent-row{display:flex;align-items:center;gap:11px;padding:13px 13px;border-radius:var(--r-ctrl);
  background:var(--input);border:1px solid var(--divider);text-align:left;transition:border-color .15s,background .15s}
.consent-row:hover{border-color:#3a3a41}
.consent-row.on{border-color:var(--gold-line);background:rgba(197,160,89,.06)}
.consent-row .box{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--divider);display:grid;place-items:center;flex:none;background:var(--surface);color:#1a1408}
.consent-row.on .box{background:var(--gold);border-color:transparent}
.consent-row .cr-txt{flex:1;min-width:0;font-size:13.5px;color:#e6e6ea}
.consent-row .cr-txt b{font-weight:600;color:#fff}
.consent-row .cr-link{flex:none;color:var(--gold-2);width:30px;height:30px;display:grid;place-items:center;border-radius:8px}
.consent-row .cr-link:hover{background:var(--surface)}

/* ============================== v6 K14: SKELETON SHIMMER ============================== */
.skel{position:relative;overflow:hidden;background:#1d1d21;border-radius:8px}
.skel::after{content:"";position:absolute;inset:0;transform:translateX(-100%);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.06),transparent);animation:shimmer 1.15s var(--ease) infinite}
@keyframes shimmer{100%{transform:translateX(100%)}}
.skel-row{display:flex;align-items:center;gap:12px;padding:10px 14px}
.skel-line{height:11px;border-radius:6px}
.skel-card{background:var(--surface);border:1px solid var(--divider);border-radius:var(--r-card);padding:15px 16px;display:flex;flex-direction:column;gap:10px}

/* ============================== v6 K6: optimistic pending tag ============================== */
.card.pending{opacity:.74}
.pending-tag{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:700;color:var(--gold-2);
  background:rgba(197,160,89,.12);border-radius:6px;padding:2px 7px;margin-top:7px}
.pending-tag i{width:7px;height:7px;border-radius:50%;background:var(--gold);animation:pendPulse 1s ease-in-out infinite}
@keyframes pendPulse{0%,100%{opacity:.4}50%{opacity:1}}

/* ============================== v6 K11: MONTH CALENDAR (v5 surface language) ============================== */
.month-grid-wrap{flex:1;min-height:0;overflow:auto;padding:2px 16px 18px}
html[data-frame="desktop"] .month-grid-wrap{padding:2px 22px 22px}
/* Год — 12 months overview → pick a month */
.year-grid-wrap{flex:1;min-height:0;overflow:auto;padding:2px 16px 18px}
html[data-frame="desktop"] .year-grid-wrap{padding:2px 22px 22px}
.year-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
html[data-frame="desktop"] .year-grid{grid-template-columns:repeat(4,1fr);gap:12px}
.ycell{display:flex;flex-direction:column;gap:6px;min-height:88px;border-radius:12px;background:var(--surface);border:1px solid var(--divider);padding:12px;cursor:pointer;text-align:left;transition:border-color .15s,background .15s}
.ycell:hover{border-color:var(--gold-line);background:#1f1f23}
.ycell:active{transform:translateY(1px)}
.ycell.today{border-color:var(--gold-line);box-shadow:inset 0 0 0 1px var(--gold-line)}
.ycell .ym-name{font-size:14px;font-weight:700;letter-spacing:-.01em}
.ycell.today .ym-name{color:var(--gold)}
.ycell .ym-cnt{margin-top:auto;font-size:11px;font-weight:600;color:var(--gold-2);display:flex;align-items:center;gap:5px}
.ycell .ym-cnt.muted{color:#56565e}
.ycell .ym-cnt .dot{width:5px;height:5px;background:var(--gold);flex:none}
.month-dow{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin-bottom:7px}
.month-dow span{font-size:11px;font-weight:700;color:var(--text-2);text-align:center;text-transform:uppercase;letter-spacing:.04em}
.month-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}
.mcell{min-height:68px;border-radius:12px;background:var(--surface);border:1px solid var(--divider);
  display:flex;flex-direction:column;padding:7px 8px;cursor:pointer;transition:border-color .15s var(--ease),background .15s var(--ease),transform .1s var(--ease);min-width:0}
.mcell:hover{border-color:var(--gold-line);background:#1f1f23}
.mcell:active{transform:translateY(1px)}
.mcell.muted{opacity:.4;cursor:default;pointer-events:none}
.mcell.today{border-color:var(--gold-line);box-shadow:inset 0 0 0 1px var(--gold-line)}
.mcell .md-num{font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums}
.mcell.today .md-num{color:var(--gold)}
.mcell .md-cnt{margin-top:auto;font-size:10.5px;font-weight:600;color:var(--gold-2);display:flex;align-items:center;gap:4px;min-width:0}
.mcell .md-cnt .dot{width:5px;height:5px;background:var(--gold)}
.mcell .md-cnt span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html[data-frame="desktop"] .mcell{min-height:96px}
html[data-frame="desktop"] .mcell .md-num{font-size:15px}
.month-pick{background:none;border:0;cursor:pointer;text-align:left;padding:3px 6px;border-radius:9px;display:flex;flex-direction:column;gap:1px;min-width:0}
.month-pick:hover{background:#1f1f23}
.month-pick b{font-size:17px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.month-pick small{font-size:11.5px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important;animation-iteration-count:1!important}
  .skel::after{animation:none}
}
/* small screens: scale frames down gracefully */
@media (max-width:480px){
  .controls{padding:10px 12px;gap:8px}
  .controls .logo small,.controls .meta{display:none}
  .phone{transform:scale(min(1,calc((100vw - 16px)/390)));transform-origin:top center}
}

/* ============================== v7 ADDITIONS (reuse tokens) ============================== */
/* v7 pass-2: iOS-style toggle switch (reused: 2FA, role gates) */
.toggle{flex:none;width:44px;height:26px;border-radius:99px;background:var(--input);border:1px solid var(--divider);
  position:relative;transition:background .18s var(--ease),border-color .18s var(--ease);cursor:pointer}
.toggle i{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#8a8a92;
  transition:transform .18s var(--ease),background .18s var(--ease)}
.toggle.on{background:var(--gold);border-color:transparent}
.toggle.on i{transform:translateX(18px);background:#1a1408}
/* --- custom-fields section in cards --- */
.cf-block{display:flex;flex-direction:column;gap:12px}
.cf-row{display:flex;flex-direction:column;gap:5px}
.cf-row .cf-lbl{font-size:12px;font-weight:600;color:var(--text-2);display:flex;align-items:center;gap:6px}
.cf-row .cf-lbl .req{color:#f0a3a1}
.cf-val{font-size:13.5px;color:#e6e6ea}
.cf-check{display:inline-flex;align-items:center;gap:8px;font-size:13.5px}
.cf-check .box{width:18px;height:18px;border-radius:6px;border:1.5px solid var(--divider);display:grid;place-items:center;flex:none;background:var(--input)}
.cf-check.on .box{background:var(--gold);border-color:transparent;color:#1a1408}
/* --- duplicate banner --- */
.dup-banner{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:12px;
  background:rgba(197,160,89,.1);border:1px solid var(--gold-line)}
.dup-banner .db-ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;
  background:var(--gold-soft);color:var(--gold)}
.dup-banner b{font-size:13px;font-weight:700;display:block}
.dup-banner small{font-size:11.5px;color:var(--text-2)}
.dup-banner .btn{height:34px;flex:none;margin-left:auto}
/* --- merge sheet --- */
.merge-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.merge-col{background:var(--surface);border:1px solid var(--divider);border-radius:12px;padding:11px 12px;min-width:0}
.merge-col h6{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text-2);margin-bottom:9px}
.merge-field{padding:8px 0;border-top:1px solid var(--divider)}
.merge-field:first-of-type{border-top:none}
.merge-field label{font-size:11px;color:var(--text-2);display:block}
.merge-field .mf-pick{display:flex;align-items:center;gap:8px;margin-top:3px;cursor:pointer}
.merge-field .mf-radio{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--divider);flex:none;display:grid;place-items:center}
.merge-field.keep .mf-radio{border-color:var(--gold)}
.merge-field.keep .mf-radio::after{content:'';width:8px;height:8px;border-radius:50%;background:var(--gold)}
.merge-field .mf-val{font-size:13px;min-width:0;overflow-wrap:anywhere}
/* --- chat: reactions, reply quote, channels --- */
.b-reactions{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap}
.b-reactions .rx{display:inline-flex;align-items:center;gap:3px;height:22px;padding:0 7px;border-radius:11px;
  font-size:12px;background:var(--input);border:1px solid var(--divider);cursor:pointer}
.b-reactions .rx.mine{background:var(--gold-soft);border-color:var(--gold-line)}
.bubble.out .b-reactions{justify-content:flex-end}
.bubble.selectable{cursor:pointer}
.bubble.edited .b-meta::before{content:'изм. ';opacity:.7}
.reply-quote{display:flex;align-items:center;gap:9px;padding:7px 10px;margin:0 10px;border-left:3px solid var(--gold);
  background:var(--input);border-radius:8px}
.reply-quote .rq-txt{min-width:0;flex:1}
.reply-quote .rq-txt b{font-size:12px;color:var(--gold)}
.reply-quote .rq-txt small{font-size:12px;color:var(--text-2);display:block}
.reply-quote .rq-x{flex:none;color:var(--text-2)}
.b-reply{font-size:12px;padding:5px 8px;border-left:2px solid currentColor;opacity:.75;margin-bottom:4px;border-radius:5px}
.bubble.in .b-reply{background:rgba(255,255,255,.05)}
.bubble.out .b-reply{background:rgba(34,26,9,.12)}
/* reaction picker row in popmenu */
.rx-picker{display:flex;gap:4px;padding:8px 10px;border-bottom:1px solid var(--divider)}
.rx-picker button{width:34px;height:34px;border-radius:9px;font-size:19px;display:grid;place-items:center;background:transparent}
.rx-picker button:hover{background:var(--input)}
/* attachment picker sheet */
.attach-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.attach-grid .ph{aspect-ratio:1;border-radius:10px;background:var(--input);cursor:pointer;position:relative;overflow:hidden}
.attach-grid .ph::after{content:'';position:absolute;inset:0;background:inherit;opacity:.9}
.attach-actions{display:flex;gap:9px;margin-top:13px}
.attach-actions .aa{flex:1;height:74px;border-radius:12px;background:var(--input);border:1px solid var(--divider);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:12px;font-weight:600;color:var(--text-2)}
.attach-actions .aa svg{color:var(--gold)}
.attach-actions .aa:hover{border-color:var(--gold-line);color:#fff}
/* voice playing state */
.b-voice.playing .vp{background:var(--gold);color:#1a1408}
.bubble.out .b-voice.playing .vp{background:rgba(34,26,9,.4);color:#fff}
.b-wave i.played{opacity:1}
/* chat section toggle */
.cl-sectabs{display:flex;gap:4px;background:var(--input);border:1px solid var(--divider);border-radius:10px;padding:4px;margin:0 14px 8px}
.cl-sectabs button{flex:1;height:30px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--text-2)}
.cl-sectabs button.on{background:var(--surface);color:#fff;box-shadow:var(--sh-1),inset 0 0 0 1px var(--gold-line)}
.cl-sectabs button.on svg{color:var(--gold)}
.cl-sectabs button{display:inline-flex;align-items:center;justify-content:center;gap:6px}
/* channel feed */
.chan-feed{flex:1;min-height:0;overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.chan-post{background:var(--surface);border:1px solid var(--divider);border-radius:14px;padding:13px 15px}
.chan-post .cp-head{display:flex;align-items:center;gap:9px;margin-bottom:7px}
.chan-post .cp-head .ava{width:34px;height:34px;font-size:12px;border-radius:10px}
.chan-post .cp-head b{font-size:13.5px}
.chan-post .cp-head small{font-size:11.5px;color:var(--text-2);display:block}
.chan-post .cp-body{font-size:14px;line-height:1.5;color:#e6e6ea;overflow-wrap:anywhere}
.chan-post .cp-foot{display:flex;align-items:center;gap:16px;margin-top:9px;font-size:12px;color:var(--text-2)}
.chan-post .cp-foot span{display:inline-flex;align-items:center;gap:5px}
/* --- finance depth lists --- */
.fin-actions{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:4px}
.lr-due{font-size:11px;color:var(--text-2)}
/* --- task board depth --- */
.task-filters{display:flex;gap:7px;flex-wrap:wrap;padding:0 0 2px}
.task-board-card{background:var(--surface);border:1px solid var(--divider);border-radius:13px;padding:12px 13px;margin-bottom:9px;cursor:pointer;transition:border-color .14s var(--ease)}
.task-board-card:hover{border-color:#34343a}
.task-board-card.tdone{opacity:.6}
.tbc-top{display:flex;align-items:flex-start;gap:9px}
.tbc-top .prio{width:9px;height:9px;border-radius:50%;flex:none;margin-top:5px}
.tbc-top b{font-size:13.5px;font-weight:600;flex:1;min-width:0}
.tbc-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px;font-size:11.5px;color:var(--text-2)}
.tbc-meta .tchip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:7px;background:var(--input);border:1px solid var(--divider)}
.tcol-h{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--text-2);margin:14px 2px 9px}
.tcol-h .dot{width:8px;height:8px}
.tcol-h .cnt{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--text-2)}
/* v7 pass-2: reports 3-tab seg fits phone width (icons + tight padding) */
html[data-frame="phone"] #repSeg{max-width:100%}
html[data-frame="phone"] #repSeg .seg-opt{flex:1;padding:0 6px;gap:5px;min-width:0;font-size:12px}
html[data-frame="phone"] #repSeg .seg-opt svg{width:14px;height:14px}
/* v7 pass-2: Лиды pagination + filter presets --- */
.preset-band .preset-save{border-style:dashed;color:var(--gold-2)}
.preset-band .preset-save:hover{border-color:var(--gold-line);color:var(--gold)}
.lead-more{flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 16px 16px}
.lead-more .btn{height:38px}
.lead-more small{font-size:11.5px;color:var(--text-2)}
/* v7 pass-2: profile edit — avatar crop picker --- */
.ava-edit{display:flex;gap:16px;align-items:center}
.ava-crop{position:relative;width:96px;height:96px;flex:none}
.ava-crop-img{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;font-size:32px;font-weight:700;
  background:#2a2a2f;color:var(--gold-2);overflow:hidden}
.ava-crop-ring{position:absolute;inset:-4px;border-radius:50%;border:2px dashed var(--gold-line);pointer-events:none}
.ava-edit-side{flex:1;min-width:0;display:flex;flex-direction:column;gap:9px}
.ava-edit-actions{display:flex;gap:8px;flex-wrap:wrap}
.ava-tones{display:flex;gap:7px;flex-wrap:wrap}
.ava-tone{width:30px;height:30px;border-radius:50%;border:2px solid transparent;flex:none;display:grid;place-items:center;color:var(--text-2);transition:border-color .14s,transform .1s}
.ava-tone:hover{transform:scale(1.06)}
.ava-tone.on{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold-soft)}
.ava-hint{font-size:11px;color:var(--text-2)}
@media (max-width:420px){ .ava-edit{flex-direction:column;align-items:flex-start} .ava-crop{align-self:center} }
/* v7 pass-2: reports — audit feed + detail tables --- */
.audit-feed{display:flex;flex-direction:column}
.audit-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--divider);min-width:0}
.audit-row:first-child{border-top:none}
.audit-row .ava{flex:none}
.audit-mid{flex:1;min-width:0}
.audit-line{font-size:13px;color:#d4d4d8;line-height:1.4;overflow-wrap:anywhere}
.audit-line b{font-weight:600;color:#fff}
.audit-obj{color:var(--gold-2);display:inline-block;max-width:100%;vertical-align:bottom}
.audit-mid small{font-size:11.5px;color:var(--text-2);display:block;margin-top:1px}
.audit-ic{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--input);border:1px solid var(--divider)}
.rep-table-wrap{overflow-x:auto;border-radius:11px;border:1px solid var(--divider)}
.rep-table{width:100%;border-collapse:collapse;font-size:13px;min-width:380px}
.rep-table th{text-align:left;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--text-2);
  padding:10px 12px;background:var(--input);white-space:nowrap;border-bottom:1px solid var(--divider)}
.rep-table th.num,.rep-table td.num{text-align:right}
.rep-table td{padding:11px 12px;border-top:1px solid var(--divider);white-space:nowrap}
.rep-table tbody tr:hover{background:#1f1f23}
.rep-table tr.rt-cur td{background:rgba(197,160,89,.07);font-weight:700}
.rt-name{display:flex;align-items:center;gap:9px;min-width:0}
.rt-rank{flex:none;width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:11px;font-weight:700;
  background:var(--gold-soft);color:var(--gold)}
.rt-name b{font-size:13px;font-weight:600;display:block}
.rt-name small{font-size:11px;color:var(--text-2);display:block}
.rt-bar{width:90px;max-width:34vw;height:7px;border-radius:99px;background:var(--input);overflow:hidden}
.rt-bar i{display:block;height:100%;background:var(--gold);border-radius:99px}
/* v7 pass-2: lesson attendance --- */
.att-block{display:flex;flex-direction:column;gap:9px;background:var(--input);border:1px solid var(--divider);border-radius:12px;padding:12px 13px}
.att-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.att-perm{font-size:10.5px;font-weight:600;color:var(--text-2);display:inline-flex;align-items:center;gap:5px;flex:none}
.att-perm svg{color:var(--gold-2)}
.att-row{display:flex;align-items:center;gap:10px;min-width:0}
.att-row .ava{width:34px;height:34px;font-size:12px;flex:none}
.att-name{flex:1;min-width:0;font-size:13.5px;font-weight:600}
.att-chips{display:flex;gap:5px;flex:none}
.att-chip{height:30px;padding:0 11px;border-radius:8px;font-size:12px;font-weight:600;color:var(--text-2);
  background:var(--surface);border:1px solid var(--divider);transition:all .14s var(--ease)}
.att-chip:not([disabled]):hover{border-color:var(--ac);color:#fff}
.att-chip.on{background:color-mix(in srgb,var(--ac) 18%,transparent);border-color:var(--ac);color:var(--ac)}
.att-chip[disabled]{opacity:.5;cursor:default}
@media (max-width:480px){ .att-chip{padding:0 9px} }
/* --- full student detail screen --- */
