[extend]
useDefault = true

[[allowlists]]
description = "Firebase client API keys are public identifiers restricted by the Firebase project configuration."
condition = "AND"
regexTarget = "match"
regexes = ['''AIza[0-9A-Za-z_-]{35}''']
paths = [
  '''android/app/google-services\.json$''',
  '''lib/firebase_options\.dart$''',
]
